<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BASTION — Orchid Protocol</title>
<style>
:root{
  --bg:#0c0714; --panel:#140c22; --panel2:#181028;
  --line:#2e2148; --line2:#3d2c5e;
  --ivory:#efe6f7; --dim:#9a8ab5;
  --acc:#d16bff; --acc2:#e6b8ff; --amber:#f2b45c;
  --red:#ff5c7a; --green:#8fd08a; --frost:#9fc4cf;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ivory);font-family:'Chakra Petch',sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-family:'IBM Plex Mono',monospace}
.gold{color:var(--amber)}
#app{max-width:1440px;margin:0 auto;padding:16px 20px 34px}
header{display:flex;align-items:center;gap:22px;padding:4px 2px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:26px;height:26px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.34em}
.brand .sub{font-size:9px;letter-spacing:.3em;color:var(--dim);display:block;margin-top:2px;font-weight:500}
.hspacer{flex:1}
.stats{display:flex;align-items:center;gap:22px}
.stat{display:flex;align-items:center;gap:9px}
.stat svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
.stat .lbl{font-size:9px;letter-spacing:.28em;color:var(--dim)}
#goldV{color:var(--amber)}
#comboV{color:var(--acc2);font-size:14px}
#livesV.hurt{animation:hurtFlash .5s ease-out}
@keyframes hurtFlash{0%{color:var(--red)}100%{color:var(--ivory)}}
.controls{display:flex;gap:7px}
.cbtn{width:36px;height:32px;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.cbtn:hover{color:var(--ivory);border-color:var(--line2)}
.cbtn svg{width:15px;height:15px}
main{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#boardWrap{position:relative;flex:1 1 640px;max-width:1080px;min-width:320px}
canvas{display:block;width:100%;height:auto;border:1px solid var(--line);cursor:crosshair}
#banner{position:absolute;left:50%;top:46px;transform:translate(-50%,-14px);opacity:0;transition:all .28s ease;pointer-events:none;text-align:center;background:rgba(16,9,28,.94);border:1px solid var(--acc);padding:10px 26px 11px}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.bad{border-color:var(--red)}
#banner b{display:block;font-size:15px;font-weight:600;letter-spacing:.3em}
#banner span{display:block;font-size:9px;letter-spacing:.24em;color:var(--dim);margin-top:4px;font-family:'IBM Plex Mono',monospace}
#banner.bad span{color:#ff9db0}
#edgeFlash{position:absolute;inset:0;pointer-events:none;opacity:0}
#edgeFlash.on{animation:eflash .55s ease-out}
@keyframes eflash{0%{opacity:1;box-shadow:inset 0 0 70px rgba(255,92,122,.5)}100%{opacity:0;box-shadow:inset 0 0 70px rgba(255,92,122,0)}}
#rail{width:308px;display:flex;flex-direction:column;gap:12px}
#rail section{border:1px solid var(--line);background:var(--panel);padding:14px}
#rail h3{font-size:10px;font-weight:600;letter-spacing:.32em;color:var(--dim);display:flex;align-items:center;gap:12px;margin-bottom:12px}
#rail h3::after{content:'';flex:1;height:1px;background:var(--line)}
.shop-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid #261b3c;padding:9px 10px;margin-bottom:7px;position:relative;transition:border-color .12s}
.shop-row:last-child{margin-bottom:0}
.shop-row:hover{border-color:var(--line2)}
.shop-row.sel{border-color:var(--acc);background:#1d1233}
.shop-row.sel::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--acc)}
.shop-row.cant{opacity:.42}
.sg{width:26px;height:26px;flex-shrink:0}
.sg svg{width:100%;height:100%}
.si{flex:1;min-width:0}
.si b{display:block;font-size:12px;font-weight:600;letter-spacing:.14em}
.si span{display:block;font-size:9.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.sc{display:flex;align-items:center;gap:7px}
.sc b{font-size:14px;color:var(--amber)}
.sc i{font-style:normal;font-size:9px;color:var(--dim);border:1px solid var(--line);width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
#inspector{min-height:236px}
.ins-head{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.ins-head .sg{width:30px;height:30px}
.ins-head b{display:block;font-size:14px;font-weight:700;letter-spacing:.18em}
.mk{font-size:9px;color:var(--red);letter-spacing:.2em;font-family:'IBM Plex Mono',monospace;vertical-align:2px;margin-left:5px}
.ins-sub{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.ih-mark svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round}
.piprows{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pr{display:flex;align-items:center;gap:8px}
.pr>span{font-size:9px;letter-spacing:.26em;color:var(--dim);width:38px}
.pip{width:12px;height:8px;border:1px solid var(--line2);display:inline-block;margin-right:4px}
.pip.on{background:var(--acc);border-color:var(--acc)}
.pr:last-child .pip{width:8px;height:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:12px}
.statgrid>div{border-left:2px solid var(--line2);padding-left:9px}
.statgrid label{display:block;font-size:8.5px;letter-spacing:.24em;color:var(--dim)}
.statgrid b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:2px}
.ins-note{font-size:9.5px;letter-spacing:.12em;color:var(--frost);margin:-4px 0 12px;font-family:'IBM Plex Mono',monospace}
.ins-btns{display:flex;flex-direction:column;gap:6px}
.ubtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px;border:1px solid var(--line);font-size:11px;letter-spacing:.14em;font-weight:500}
.ubtn b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--acc2)}
.ubtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc2)}
.ubtn:disabled{opacity:.38;cursor:default}
.abbtn{border-color:#5e2a4a;color:#ffb8ec}
.abbtn b{color:#ffb8ec}
.abbtn:hover:not(:disabled){border-color:var(--acc);background:#241236}
.sellb:hover:not(:disabled){border-color:var(--red);color:#ff9db0}
.sellb b{color:#ff9db0}
.ins-tip{font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:10px}
.ins-tip b{color:var(--ivory)}
#wavePre{margin-bottom:12px}
.pv-head{font-size:11px;font-weight:600;letter-spacing:.22em;margin-bottom:9px}
.pvb{color:var(--red);border:1px solid var(--red);padding:1px 7px;font-size:8.5px;letter-spacing:.2em;margin-left:6px;vertical-align:2px}
.pve{color:var(--acc2);border:1px solid var(--acc);padding:1px 7px;font-size:8.5px;letter-spacing:.2em;margin-left:6px;vertical-align:2px}
.pvm{color:var(--amber);border:1px solid var(--amber);padding:1px 7px;font-size:8.5px;letter-spacing:.2em;margin-left:6px;vertical-align:2px}
.pv-row{display:flex;gap:13px;flex-wrap:wrap}
.pv-it{display:flex;align-items:center;gap:5px}
.pv-it svg{width:15px;height:15px}
.pv-it b{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);font-weight:500}
.pv-hp{font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:9px;font-family:'IBM Plex Mono',monospace}
.launch{width:100%;padding:13px 10px;border:1px solid var(--acc);color:var(--acc2);letter-spacing:.24em;font-size:13px;font-weight:600;display:block}
.launch:hover:not(:disabled){background:var(--acc);color:#0c0714}
.launch:disabled{opacity:.45;cursor:default;border-color:var(--line2);color:var(--dim)}
.launch #launchTxt{display:block}
.launch #launchSub{display:block;font-size:8.5px;letter-spacing:.2em;margin-top:4px;font-family:'IBM Plex Mono',monospace;color:var(--dim);font-weight:400}
#autoBar{height:3px;background:var(--line);margin-top:9px;visibility:hidden}
#autoBar i{display:block;height:100%;background:var(--acc);width:0%}
#overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(8,4,16,.88);backdrop-filter:blur(3px);padding:20px}
.panel{width:min(560px,94vw);border:1px solid var(--line2);background:var(--panel);padding:42px 44px;position:relative}
.panel::before,.panel::after{content:'';position:absolute;width:15px;height:15px;border:1px solid var(--acc)}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.panel.bad::before,.panel.bad::after{border-color:var(--red)}
.ov-mark svg{width:34px;height:34px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round;margin-bottom:16px}
.panel.bad .ov-mark svg{stroke:var(--red)}
.panel h1{font-size:31px;font-weight:700;letter-spacing:.16em;line-height:1.2}
.panel.bad h1{color:var(--red)}
.ov-tag{font-size:12.5px;color:var(--dim);margin-top:9px;letter-spacing:.05em}
.ov-rules{margin:26px 0 30px;display:flex;flex-direction:column;gap:13px}
.ov-rules>div{display:flex;gap:13px;align-items:flex-start}
.ov-rules svg{width:17px;height:17px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;flex-shrink:0;margin-top:2px}
.ov-rules span{font-size:12.5px;color:var(--dim);line-height:1.55}
.ov-stats{display:flex;border:1px solid var(--line);margin:24px 0 30px}
.ov-stats>div{flex:1;padding:14px 16px;border-right:1px solid var(--line)}
.ov-stats>div:last-child{border-right:none}
.ov-stats label{display:block;font-size:8.5px;letter-spacing:.24em;color:var(--dim)}
.ov-stats b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;margin-top:5px}
.ov-btn{width:100%;padding:14px;border:1px solid var(--acc);color:var(--acc2);letter-spacing:.3em;font-size:14px;font-weight:600}
.ov-btn:hover{background:var(--acc);color:#0c0714}
.ov-btn2{width:100%;padding:12px;margin-top:10px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.3em;font-size:12px;font-weight:600}
.ov-btn2:hover{border-color:var(--acc);color:var(--acc2)}
.ov-keys{text-align:center;font-size:9px;letter-spacing:.24em;color:var(--dim);margin-top:16px;font-family:'IBM Plex Mono',monospace}
.cards-row{display:flex;gap:14px;margin:26px 0 8px}
.card{flex:1;border:1px solid var(--line2);background:var(--panel2);padding:18px 16px 16px;text-align:left;transition:all .15s;position:relative}
.card:hover{border-color:var(--acc);transform:translateY(-4px);background:#221540}
.card .cn{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--acc2);display:block;margin-bottom:8px}
.card .cd{font-size:11px;color:var(--dim);line-height:1.55;display:block}
.card .cp{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--red);display:block;margin-top:9px;letter-spacing:.1em}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc)}

<script>

/* ============================================================
   BASTION — ORCHID PROTOCOL · DIRECTIVE 11 · GFX v2

   + GLM-5.3 UPGRADE PASS: save schema v2, seeded gameplay RNG,
   dev test harness, adaptive quality, settings, touch, a11y.

const CELL=48, COLS=32, ROWS=18, W=COLS*CELL, H=ROWS*CELL;

cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);

const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const lt=(h,f)=>{const n=parseInt(h.slice(1),16);
  const r=Math.min(255,Math.round((n>>16&255)*f)),g=Math.min(255,Math.round((n>>8&255)*f)),b=Math.min(255,Math.round((n&255)*f));
  return `rgb(${r},${g},${b})`;};
const dr=i=>{const v=Math.sin(i*127.13+311.7)*43758.5453;return v-Math.floor(v);};
const BEST_KEY='bastion_orchid_best', SAVE_KEY='bastion_orchid_save';
const SAVE_SCHEMA=2, PREFS_KEY='bastion_orchid_prefs';
const loadBest=()=>{try{return +localStorage.getItem(BEST_KEY)||0;}catch(e){return 0;}};

let bestWave=loadBest();

/* ▲ GLM: debug + dev-test activation (never visible in normal play) */
const DEBUG=(()=>{try{return /(?:debug|devtest)=1/.test(location.search);}catch(e){return false;}})();

/* ▲ GLM PHASE 2 — gameplay RNG (seedable) vs cosmetic RNG.
   Gameplay-affecting randomness (elite rolls, spawn lane, card shuffle)
   uses GRNG so regression tests can lock a seed. Cosmetic randomness
   (particles, VFX, audio detune) uses CRAND and never touches GRNG. */
const GRNG={
  s:(((Date.now()^performance.now())>>>0)%2147483646)+1,
  set(v){this.s=(Math.floor(v)|0)%2147483646;if(this.s<=0)this.s+=2147483646;},
  seed(){return this.s;},
  f(){this.s=(this.s*16807)%2147483647;return (this.s-1)/2147483646;}
};
const CRAND=Math.random;

/* ▲ GLM PHASE 3 — user preferences, stored separately from progress. */
const PREFS={muted:false,vol:.8,quality:'auto',motion:'auto',cb:false,shake:true,themeIx:0};
let prefsT=0;
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}');
    if(typeof p.muted==='boolean')PREFS.muted=p.muted;
    if(Number.isFinite(p.vol))PREFS.vol=Math.min(1,Math.max(0,p.vol));
    if(['auto','high','medium','low'].includes(p.quality))PREFS.quality=p.quality;
    if(['auto','on','off'].includes(p.motion))PREFS.motion=p.motion;
    PREFS.cb=!!p.cb; PREFS.shake=p.shake!==false;
    if(Number.isInteger(p.themeIx)&&p.themeIx>=0)prefsThemeGate(p.themeIx);
  }catch(e){}
}
function prefsThemeGate(v){if(v<3)PREFS.themeIx=v;}
function savePrefs(force){
  const n=performance.now();
  if(!force&&n-prefsT<1000)return; prefsT=n;
  try{localStorage.setItem(PREFS_KEY,JSON.stringify(PREFS));}catch(e){}
}

/* ▲ GLM PHASE 9/20 — adaptive quality (presentation-only budgets). */
const QLEV={
  high:  {parts:420,petal:60,fog:6,amb:1.0,shake:1.0,runes:true, glow:1.0,echo:48},
  medium:{parts:260,petal:28,fog:3,amb:0.6,shake:0.7,runes:true, glow:0.7,echo:28},
  low:   {parts:140,petal:0, fog:0,amb:0.35,shake:0.45,runes:false,glow:0.4,echo:14}
};
const QUAL={cur:'high',avg:16.6,lowT:0,highT:0};
function qLevel(){return PREFS.quality==='auto'?QUAL.cur:PREFS.quality;}
function Q(){return QLEV[qLevel()];}
function qualSample(ms){
  QUAL.avg+=(ms-QUAL.avg)*.05;
  if(PREFS.quality!=='auto')return;
  if(QUAL.avg>26){QUAL.lowT++;QUAL.highT=0;
    if(QUAL.lowT>90&&QUAL.cur!=='low'){QUAL.cur=QUAL.cur==='high'?'medium':'low';QUAL.lowT=0;}}
  else if(QUAL.avg<15){QUAL.highT++;QUAL.lowT=0;
    if(QUAL.highT>360&&QUAL.cur!=='high'){QUAL.cur=QUAL.cur==='low'?'medium':'high';QUAL.highT=0;}}
  else{QUAL.lowT=Math.max(0,QUAL.lowT-1);QUAL.highT=Math.max(0,QUAL.highT-1);}
}

/* ▲ GLM PHASE 12 — fatal error recovery overlay (polished, player-safe). */

const SEGS=[]; let PATHLEN=0;
for(let i=0;i<WAY.length-1;i++){
  const a=WAY[i],b=WAY[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
  SEGS.push({x:a.x,y:a.y,dx:(b.x-a.x)/len,dy:(b.y-a.y)/len,len,acc:PATHLEN});
  PATHLEN+=len;
}
function posAt(d){
  if(!isFinite(d))d=0;
  d=Math.max(0,Math.min(PATHLEN-0.01,d));
  let s=SEGS[SEGS.length-1];
  for(const g of SEGS){ if(d<g.acc+g.len){s=g;break;} }
  const t=d-s.acc;
  return {x:s.x+s.dx*t,y:s.y+s.dy*t,dx:s.dx,dy:s.dy};
}

function initAudio(){

/* ▲ GLM PHASE 17/18 — layered tone with cosmetic micro-detune, stereo pan,
   polyphony cap for low-priority sounds, node cleanup on ended. */
function tone(f1,f2,dur,type,vol,when=0,pan=0,pri=0){
  if(!AC||muted) return;
  if(!pri&&voices>=VOICE_CAP) return;
  voices++;
  const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  const jit=1+(CRAND()-.5)*.045;
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f1*jit),t0);
  if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2*jit),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let tail=g;
  if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));g.connect(p);tail=p;}
  o.connect(g);tail.connect(master);o.start(t0);o.stop(t0+dur+.03);
  o.onended=()=>{voices--;try{o.disconnect();g.disconnect();if(tail!==g)tail.disconnect();}catch(e){}};
}
function noiseHit(dur,vol,cut,pan=0,pri=0){
  if(!AC||muted) return;
  if(!pri&&voices>=VOICE_CAP) return;
  voices++;
  const n=Math.max(1,Math.floor(AC.sampleRate*dur)),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;
  const g=AC.createGain();g.gain.value=vol;
  let tail=g;
  if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));g.connect(p);tail=p;}
  s.connect(f);f.connect(g);tail.connect(master);s.start();
  s.onended=()=>{voices--;try{s.disconnect();f.disconnect();g.disconnect();if(tail!==g)tail.disconnect();}catch(e){}};
}

  if(w%5===0)g.push({t:'boss',n:Math.min(6,Math.floor(w/5)),gap:2.6});
  g.push({t:'runner',n:cap(10+Math.round(w*2.2),90),gap:Math.max(.14,.42-w*.01)});
  if(w>=3)g.push({t:'soldier',n:cap(5+w,50),gap:.5});
  if(w>=6)g.push({t:'brute',n:cap(2+Math.floor(w/2),26),gap:1.1});
  if(w>=7)g.push({t:'swarm',n:cap(10+Math.round(w*1.8),90),gap:.12});
  if(w>=8)g.push({t:'shade',n:cap(4+Math.floor(w*.9),40),gap:.38});
  if(w>=9)g.push({t:'warden',n:cap(1+Math.floor((w-9)/2.5),12),gap:1.8});
  if(w>=12)g.push({t:'soldier',n:cap(Math.floor(w),40),gap:.35});
  if(w>=14)g.push({t:'saboteur',n:cap(1+Math.floor((w-14)/4),8),gap:3});
  if(w>=15)g.push({t:'brute',n:cap(Math.floor(w/3),16),gap:.9});

function jagged(x0,y0,x1,y1,seed){

/* ============================================================

const POSE=(ll,lr,al,ar,lean,bob,bh)=>({ll,lr,al,ar,lean,bob:bob||0,bh:bh||0});
const STAND=POSE(.18,-.18,.35,-.55,0,0,0);

/* ▲ boss walk rig — heavy stomp cycle, 6 keyframes
   (ll/lr: hip swing · kl/kr: knee bend · lean: body tilt · bob: vertical
   · sw: shoulder-cannon sway). BOSST reproduces the original silhouette. */
const BOSSF=[
  {ll:.65,lr:-.7,kl:-.2,kr:-.9,lean:.14,bob:2,sw:-.06},

const BOSST={ll:-.15,lr:.15,kl:.25,kr:-.25,lean:0,bob:0,sw:0};
function mech(g,x,y,s,o){
  g.save();g.translate(x,y);g.scale(s,s);
  const suit=o.suit,trim=o.trim||'#cfd8e6',vis=o.visor||SPAL.turq;
  const ol=SPAL.ol,B=o.bulk||0;
  const lw=7.5+B*2.2,hl=10+B*1.7,sh=8+B*3.6,hipY=-26;
  const p=o.pose||STAND;
  g.rotate((p.lean||0)*.35);
  g.translate(0,p.bob||0);
  const torsoC=o.torso||'#5d6d84';
  const leg=(sd,ha)=>{
    const hx=sd*(4+B),hy=hipY;
    const kx=hx+Math.sin(ha)*(11+B*2),ky=hy+Math.cos(ha)*(11+B*2);
    const fx=kx+Math.sin(ha*.4)*4,fy=ky+11;
    limb(g,hx,hy,kx,ky,lw,suitHi(suit));limb(g,kx,ky,fx,fy,lw-1.4,suitLo(suit));
    g.fillStyle=trim;g.strokeStyle=ol;g.lineWidth=1.8;
    rr(g,fx-4,fy-3,10,6,2.6);g.fill();g.stroke();
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(fx-3.4,fy-2.6,8.8,1.6);
    g.beginPath();g.arc(kx,ky,2.2+B*.3,0,TAU);
    g.fillStyle=o.pauldCol||trim;g.fill();
    g.strokeStyle=ol;g.lineWidth=1.2;g.stroke();};
  const arm=(sd,aa)=>{
    const sx=sd*sh,sy=-43+B;
    const ex=sx+Math.sin(aa)*(9+B*2),ey=sy+Math.cos(aa)*(9+B*2);
    const hx2=ex+Math.sin(aa*.35)*8,hy2=ey+8.5;
    limb(g,sx,sy,ex,ey,lw-1.2,suitHi(suit));limb(g,ex,ey,hx2,hy2,lw-2,suitLo(suit));
    g.fillStyle=trim;g.beginPath();g.arc(hx2,hy2,2.9+B*.4,0,TAU);g.fill();
    g.strokeStyle=ol;g.lineWidth=1.5;g.stroke();
    return [hx2,hy2];};
  leg(-1,p.ll);leg(1,p.lr);
  arm(-1,p.al);

  const tg=g.createLinearGradient(0,-46+B,0,hipY+1);
  tg.addColorStop(0,lt(torsoC,1.4));tg.addColorStop(.45,torsoC);tg.addColorStop(1,lt(torsoC,.55));
  poly(g,[[-sh-1,-46+B],[sh+1,-46+B],[sh*.55,hipY+1],[-sh*.55,hipY+1]]);
  g.fillStyle=tg;g.fill();
  g.strokeStyle=ol;g.lineWidth=2.2;g.stroke();
  g.beginPath();g.moveTo(-sh*.9,-45.4+B);g.lineTo(sh*.9,-45.4+B);
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1.3;g.stroke();
  const chestC=o.chest||trim;
  const cg=g.createLinearGradient(0,-44.5+B,0,-34+B*.5);
  cg.addColorStop(0,lt(chestC,1.25));cg.addColorStop(1,lt(chestC,.7));
  poly(g,[[-sh*.62,-44.5+B],[sh*.62,-44.5+B],[sh*.45,-34+B*.5],[-sh*.45,-34+B*.5]]);
  g.fillStyle=cg;g.fill();
  g.strokeStyle=ol;g.lineWidth=1.6;g.stroke();
  if(o.pack){
    g.fillStyle='#4a3a2c';g.strokeStyle=ol;g.lineWidth=1.8;
    rr(g,-sh-4,-46+B,8,16,3);g.fill();g.stroke();
    g.strokeStyle=SPAL.gold;g.lineWidth=1.2;
    g.beginPath();g.moveTo(-sh-2,-44+B);g.lineTo(-sh-2,-32+B);g.stroke();
  }
  if(o.core){g.save();g.globalCompositeOperation='lighter';
    g.fillStyle=hexA('#ff6bd8',.5);g.beginPath();g.arc(0,-39+B,6,0,TAU);g.fill();

    rr(g,-7,-2.6,18,5.2,2);g.fill();g.stroke();
    g.fillStyle='#191327';rr(g,11,-1.6,7,3.2,1.4);g.fill();g.stroke();

    g.restore();

    rr(g,-3,-3.5,12,7,2);g.fill();g.stroke();
    g.strokeStyle='#ff9a5c';g.lineWidth=1.6;
    g.beginPath();g.moveTo(9,0);g.lineTo(16,0);g.stroke();

  g.fillStyle='rgba(255,255,255,.45)';g.fillRect(2.4,-56.6+B,hl*.55,.9);

    g.strokeStyle=trim;g.lineWidth=1.4;

    g.fillStyle=vis;g.beginPath();g.arc(7.5,-72+B,1.6,0,TAU);g.fill();

    g.fillStyle=trim;g.strokeStyle=ol;g.lineWidth=1.8;
    poly(g,[[-hl+1,-58+B],[-hl-4,-66+B],[-hl+4,-61+B]]);g.fill();g.stroke();
    poly(g,[[hl-1,-58+B],[hl+4,-66+B],[hl-4,-61+B]]);g.fill();g.stroke();
  }

      const pg=g.createRadialGradient(sd*sh-2,-46+B,1,sd*sh,-44+B,6+B);

    }
  }

    g.beginPath();g.arc(0,oy,R*.55,0,TAU);g.stroke();
  }
  if(orbs>1){
    for(let i=0;i<orbs-1;i++){
      const oy1=-6-i*9,oy2=-6-(i+1)*9;
      zapPath(g,jagged(1.5,oy1,-1.5,oy2,Math.floor(time*40)+i*3));
    }
  }
  if(lv>=2){
    g.save();g.rotate(time*2);
    g.strokeStyle=hexA('#57e6d0',.7);g.lineWidth=1.4;
    for(let i=0;i<3;i++){const a=i*TAU/3;
      g.beginPath();g.moveTo(Math.cos(a)*13,Math.sin(a)*13-10);
      g.lineTo(Math.cos(a)*17,Math.sin(a)*17-10);g.stroke();}
    g.restore();
  }
  if(lv>=3){
    g.save();g.globalCompositeOperation='lighter';
    g.fillStyle=hexA('#57e6d0',.4+.2*Math.sin(time*7));
    g.beginPath();g.arc(0,-6,13,0,TAU);g.fill();
    g.restore();
  }
  if(Math.sin(time*9+t.x)>.7){
    const a=dr(Math.floor(time*7)+t.c)*TAU;
    const p1=[Math.cos(a)*8,-6+Math.sin(a)*8];
    zapPath(g,jagged(p1[0],p1[1],p1[0]*2.1,p1[1]*2.1-10,Math.floor(time*60)));
  }
}
function drawTowerBody(t,ghost){
  const col=TOWERS[t.key].color;
  ctx.save();ctx.translate(t.x,t.y);
  if(!ghost){
    ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(2,7,25,12,0,0,TAU);ctx.fill();ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=(.10+.05*Math.sin(time*2.4+t.x*.1))*Q().glow;
    const bg=ctx.createRadialGradient(0,4,4,0,4,34);
    bg.addColorStop(0,hexA(col,.5));bg.addColorStop(1,hexA(col,0));
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,4,34,0,TAU);ctx.fill();
    ctx.restore();
    const sw=(time*.7+t.x*.013)%1;
    ctx.save();ctx.globalAlpha=.14;ctx.strokeStyle=col;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(0,0,23,-1.1+sw*2.2,-.9+sw*2.2);ctx.stroke();
    ctx.restore();
    if(state==='play'&&!paused&&Math.random()<.02*Q().glow&&parts.length<Q().parts)
      parts.push({x:t.x+(Math.random()-.5)*30,y:t.y+8,vx:0,vy:-14-Math.random()*10,
        life:.8,max:.8,color:hexA(col,.5),s:1.4,rot:0,vr:1,petal:true});
  }
  if(ghost)ctx.globalAlpha=.62;
  ctx.drawImage(BASES[t.key],-48,-52,96,96);
  if(!ghost&&t===sel){
    const R=28;
    ctx.strokeStyle=hexA(TPAL.acc,.9);ctx.lineWidth=1.8;
    for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      ctx.beginPath();
      ctx.moveTo(sx*R-sx*11,sy*R);ctx.lineTo(sx*R,sy*R);ctx.lineTo(sx*R,sy*R-sy*11);
      ctx.stroke();
    }
  }
  ctx.save();ctx.scale(.8,.8);
  if(t.key==='frost') headRime(ctx,t);
  else if(t.key==='tesla') headTesla(ctx,t);
  else{
    ctx.rotate(t.ang);
    if(t.key==='bolt')headBolt(ctx,t.dmgLv,t.recoil*1.2,ghost?0:t.flash);
    else if(t.key==='mortar')headLob(ctx,t.dmgLv,t.recoil*1.2,ghost?0:t.flash);
    else headRail(ctx,t,t.recoil*1.2,ghost?0:t.flash);
  }
  ctx.restore();
  if(!ghost){
    for(let i=0;i<t.dmgLv;i++)
      plusPip(ctx,20,-14+i*9,7,'#ff5c5c');
    for(let i=0;i<t.rateLv;i++){
      ctx.save();ctx.translate(-8+i*8,20);
      diamondPath(ctx,3);ctx.fillStyle='#f2b45c';ctx.fill();ctx.restore();
    }
    if(t.dmgLv===3&&t.abCd<=0){
      ctx.save();ctx.globalAlpha=.5+.3*Math.sin(time*5);
      ctx.strokeStyle='#ffb8ec';ctx.lineWidth=1.4;
      ctx.setLineDash([4,5]);ctx.lineDashOffset=time*15;
      ctx.beginPath();ctx.arc(0,0,27,0,TAU);ctx.stroke();
      ctx.setLineDash([]);
      for(let i=0;i<3;i++){const a=time*1.5+i*TAU/3;
        ctx.save();ctx.translate(Math.cos(a)*27,Math.sin(a)*27);ctx.rotate(a);
        diamondPath(ctx,3);ctx.fillStyle='#ffb8ec';ctx.fill();ctx.restore();}
      ctx.restore();
    }
  }
  ctx.restore();
}

function paintFlower(c,x,y,s,col,rot){
  c.save();c.translate(x,y);c.rotate(rot);
  for(let i=0;i<5;i++){
    c.save();c.rotate(i*TAU/5+.3);
    c.beginPath();c.ellipse(0,-s*.6,s*.28,s*.52,0,0,TAU);
    c.fillStyle=hexA(col,.75);c.fill();
    c.strokeStyle=hexA(TPAL.speck,.3);c.lineWidth=.6;c.stroke();
    c.restore();
  }
  const g=c.createRadialGradient(0,0,.5,0,0,s*.34);
  g.addColorStop(0,'#fff2c8');g.addColorStop(1,SPAL.gold);
  c.fillStyle=g;c.beginPath();c.arc(0,0,s*.3,0,TAU);c.fill();
  c.restore();
}
function paintCrystal(c,x,y,s,col){
  c.save();c.translate(x,y);
  c.shadowColor=hexA(col,.85);c.shadowBlur=14;
  const n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const bx=(i-(n-1)/2)*s*.55,h=s*(.7+Math.random()*.9),w=s*(.26+Math.random()*.14);
    c.save();c.translate(bx,0);c.rotate((Math.random()-.5)*.5);
    const g=c.createLinearGradient(0,-h,0,0);
    g.addColorStop(0,'#f4ecff');g.addColorStop(.45,col);g.addColorStop(1,'#241538');
    poly(c,[[0,-h],[w,0],[0,h*.22],[-w,0]]);
    c.fillStyle=g;c.fill();
    c.strokeStyle=hexA('#ffffff',.5);c.lineWidth=.8;c.stroke();
    c.restore();
  }
  c.shadowBlur=0;
  c.fillStyle=hexA(col,.35);
  c.beginPath();c.ellipse(0,s*.1,s*.9,s*.28,0,0,TAU);c.fill();
  c.restore();
}
function paintRock(c,x,y,s){
  c.save();c.translate(x,y);
  const n=6+Math.floor(Math.random()*3),pts=[];
  for(let i=0;i<n;i++){const a=i*TAU/n,rr2=s*(.7+Math.random()*.45);
    pts.push([Math.cos(a)*rr2,Math.sin(a)*rr2*.75]);}
  poly(c,pts);
  const g=c.createLinearGradient(0,-s,0,s);
  g.addColorStop(0,'#3a3050');g.addColorStop(1,'#171022');
  c.fillStyle=g;c.fill();
  c.strokeStyle='#0a0614';c.lineWidth=1.4;c.stroke();
  c.strokeStyle=hexA(TPAL.speck,.16);c.lineWidth=.8;
  c.beginPath();c.moveTo(pts[4][0],pts[4][1]);c.lineTo(pts[5][0],pts[5][1]);c.stroke();
  c.restore();
}
function buildStatic(){
  CRYSTALS.length=0;
  bgCv=document.createElement('canvas');
  bgCv.width=W*DPR;bgCv.height=H*DPR;
  const c=bgCv.getContext('2d');c.scale(DPR,DPR);
  let seed=97;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const base=c.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#0a0614');base.addColorStop(.45,TPAL.bgBase);base.addColorStop(1,'#060310');
  c.fillStyle=base;c.fillRect(0,0,W,H);
  const nebs=[[W*.16,H*.18,360,'#7a4ad8',.16],[W*.8,H*.55,430,'#a83a9a',.13],
    [W*.5,H*.9,320,'#4a3ad8',.11],[W*.06,H*.72,250,'#d84a8a',.09],
    [W*.92,H*.1,270,'#5b3aa8',.13],[W*.36,H*.42,210,'#ff6bd8',.06],
    [W*.62,H*.2,180,'#9db8ff',.07]];
  for(const [x,y,r,col,a] of nebs){
    const g=c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,hexA(col,a));g.addColorStop(.55,hexA(col,a*.45));g.addColorStop(1,hexA(col,0));
    c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
  }
  for(let i=0;i<230;i++){
    const x=rnd()*W,y=rnd()*H,s=.5+rnd()*1.7,a=.12+rnd()*.45;
    c.fillStyle=hexA(TPAL.speck,a);
    c.beginPath();c.arc(x,y,s,0,TAU);c.fill();
    if(rnd()<.1){
      c.strokeStyle=hexA(TPAL.speck,a*.55);c.lineWidth=.7;
      c.beginPath();c.moveTo(x-s*3.2,y);c.lineTo(x+s*3.2,y);
      c.moveTo(x,y-s*3.2);c.lineTo(x,y+s*3.2);c.stroke();
    }
  }
  c.save();c.globalCompositeOperation='lighter';
  for(const [x0,ang,ln,wd,a] of [[W*.25,-.5,900,120,.05],[W*.7,-.6,900,90,.04]]){
    c.save();c.translate(x0,-40);c.rotate(ang);
    const g=c.createLinearGradient(0,0,0,ln);
    g.addColorStop(0,hexA('#cbb8f0',a));g.addColorStop(1,hexA('#cbb8f0',0));
    c.fillStyle=g;c.fillRect(-wd/2,0,wd,ln);c.restore();
  }
  c.restore();
  for(let i=0;i<26;i++){
    const x=rnd()*W,y=rnd()*H,r=30+rnd()*70;
    const g=c.createRadialGradient(x,y,2,x,y,r);
    g.addColorStop(0,hexA(TPAL.grass,.10));g.addColorStop(1,hexA(TPAL.grass,0));
    c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  c.strokeStyle=hexA(TPAL.grid,.045);c.lineWidth=1;
  c.beginPath();
  for(let cc=1;cc<COLS;cc++){c.moveTo(cc*CELL,0);c.lineTo(cc*CELL,H);}
  for(let rr2=1;rr2<ROWS;rr2++){c.moveTo(0,rr2*CELL);c.lineTo(W,rr2*CELL);}
  c.stroke();
  c.fillStyle=hexA(TPAL.grid,.10);
  for(let cc=0;cc<=COLS;cc++)for(let rr2=0;rr2<=ROWS;rr2++)
    c.fillRect(cc*CELL-1,rr2*CELL-1,2,2);
  for(let k=0;k<5;k++){
    let x=rnd()*W,y=rnd()*H;const pts=[[x,y]];
    for(let i=0;i<5;i++){x+=(rnd()-.5)*180;y+=(rnd()-.5)*160;pts.push([x,y]);}
    c.lineJoin='round';
    c.strokeStyle=hexA(TPAL.vein,.07);c.lineWidth=7;
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
    c.strokeStyle=hexA(TPAL.vein,.22);c.lineWidth=1.3;c.stroke();
    for(const [px,py] of pts){
      if(px<20||px>W-20||py<20||py>H-20)continue;
      if(Math.hypot(px-GATE.x,py-GATE.y)<80||Math.hypot(px-BREACH.x,py-BREACH.y)<80)continue;
      paintFlower(c,px,py,3+rnd()*2.5,rnd()<.5?TPAL.vein:'#ff6bd8',rnd()*TAU);
    }
  }
  const roadPath=()=>{c.beginPath();c.moveTo(WAY[0].x,WAY[0].y);
    for(let i=1;i<WAY.length;i++)c.lineTo(WAY[i].x,WAY[i].y);};
  c.lineJoin='round';c.lineCap='round';
  c.save();
  c.shadowColor=hexA(TPAL.acc,.55);c.shadowBlur=26;
  roadPath();c.strokeStyle=hexA(TPAL.acc,.30);c.lineWidth=3;c.stroke();
  c.restore();
  roadPath();c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=54;c.stroke();
  roadPath();c.strokeStyle='#050209';c.lineWidth=50;c.stroke();
  roadPath();c.strokeStyle=TPAL.rim;c.lineWidth=46;c.stroke();
  roadPath();c.strokeStyle='rgba(255,255,255,.10)';c.lineWidth=44;c.stroke();
  roadPath();c.strokeStyle=TPAL.road;c.lineWidth=38;c.stroke();
  const rg=c.createLinearGradient(0,0,W,H);
  rg.addColorStop(0,hexA(TPAL.vein,.10));rg.addColorStop(.5,'rgba(0,0,0,0)');rg.addColorStop(1,hexA(TPAL.acc,.10));
  roadPath();c.strokeStyle=rg;c.lineWidth=38;c.stroke();
  for(let d=14;d<PATHLEN-10;d+=22){
    const p=posAt(d);
    c.strokeStyle=hexA('#000',.20);c.lineWidth=1.4;
    c.beginPath();
    c.moveTo(p.x-p.dy*17,p.y+p.dx*17);
    c.lineTo(p.x+p.dy*17,p.y-p.dx*17);
    c.stroke();
  }
  for(let d=30;d<PATHLEN-30;d+=90+rnd()*70){
    const p=posAt(d),side=rnd()<.5?1:-1;
    const x0=p.x-p.dy*12*side,y0=p.y+p.dx*12*side;
    c.strokeStyle=hexA('#000',.28);c.lineWidth=1.2;
    c.beginPath();c.moveTo(x0,y0);
    c.lineTo(x0+(rnd()-.5)*10,y0+(rnd()-.5)*10-4);c.stroke();
  }
  roadPath();c.strokeStyle=hexA(TPAL.dash,.18);c.lineWidth=1.6;c.stroke();
  for(let d=26;d<PATHLEN;d+=64){
    const p=posAt(d),side=(Math.floor(d/64)%2)?1:-1;
    const x=p.x-p.dy*21*side,y=p.y+p.dx*21*side;
    c.save();c.shadowColor=hexA(TPAL.acc,.9);c.shadowBlur=8;
    c.fillStyle=hexA(TPAL.iv,.85);
    c.beginPath();c.arc(x,y,1.8,0,TAU);c.fill();c.restore();
  }
  for(let i=0;i<170;i++){
    const cc=Math.floor(rnd()*COLS),rr2=Math.floor(rnd()*ROWS);
    if(pathSet.has(cc+','+rr2))continue;
    const x=(cc+.28+rnd()*.44)*CELL,y=(rr2+.28+rnd()*.44)*CELL;
    if(Math.hypot(x-GATE.x,y-GATE.y)<70||Math.hypot(x-BREACH.x,y-BREACH.y)<70)continue;
    const roll=rnd();
    if(roll<.36){
      c.strokeStyle=hexA(TPAL.grass,.45);c.lineWidth=1;
      c.beginPath();
      c.moveTo(x,y);c.lineTo(x-2,y-5);
      c.moveTo(x+2,y);c.lineTo(x+2,y-6);
      c.moveTo(x+4,y);c.lineTo(x+6,y-4);c.stroke();
    }else if(roll<.60){
      paintFlower(c,x,y,2.5+rnd()*3,rnd()<.45?TPAL.vein:rnd()<.5?'#ff6bd8':'#9db8ff',rnd()*TAU);
    }else if(roll<.74){
      paintRock(c,x,y,3+rnd()*4);
    }else if(roll<.86){
      const col=[SPAL.turq,SPAL.purp,'#ff6bd8',TPAL.vein][Math.floor(rnd()*4)];
      paintCrystal(c,x,y,4+rnd()*5,col);
      CRYSTALS.push({x,y,s:4+rnd()*5,col,ph:rnd()*TAU});
    }
  }
  vigCv=document.createElement('canvas');
  vigCv.width=W*DPR;vigCv.height=H*DPR;
  const v=vigCv.getContext('2d');v.scale(DPR,DPR);
  const g=v.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,W*.62);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.46)');
  v.fillStyle=g;v.fillRect(0,0,W,H);
  const tv=v.createLinearGradient(0,0,0,140);
  tv.addColorStop(0,'rgba(5,2,12,.35)');tv.addColorStop(1,'rgba(0,0,0,0)');
  v.fillStyle=tv;v.fillRect(0,0,W,140);
}

function drawSky(){
  ctx.save();
  for(const s of stars){
    ctx.globalAlpha=(.35+.65*(.5+.5*Math.sin(time*s.sp+s.ph)))*.8;
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,TAU);ctx.fill();
  }
  ctx.restore();
  if(shoot){
    const p=1-shoot.life/shoot.max;
    const x=shoot.x+shoot.vx*p*shoot.max,y=shoot.y+shoot.vy*p*shoot.max;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const a=Math.sin(Math.PI*p);
    const gr=ctx.createLinearGradient(x,y,x-shoot.vx*.12,y-shoot.vy*.12);
    gr.addColorStop(0,hexA('#ffffff',.9*a));gr.addColorStop(1,hexA('#c8b8ff',0));
    ctx.strokeStyle=gr;ctx.lineWidth=1.6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,y);
    ctx.lineTo(x-shoot.vx*.12,y-shoot.vy*.12);ctx.stroke();
    ctx.restore();
  }
}
function drawMist(){
  const q=Q();
  ctx.save();
  for(let i=0;i<q.fog&&i<fogBlobs.length;i++){
    const f=fogBlobs[i];
    ctx.globalAlpha=f.a*(0.75+0.25*Math.sin(time*.4+f.ph));
    ctx.drawImage(fogSpr,f.x-f.w/2,f.y-64,f.w,128);
  }
  ctx.restore();
  if(q.petal<=0)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  let drawn=0;
  for(const s of petals){
    if(drawn>=q.petal)break; drawn++;
    ctx.globalAlpha=.18+.22*(.5+.5*Math.sin(time*2+s.ph));
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.fillStyle=s.col?'#ffb8ec':TPAL.vein;
    diamondPath(ctx,s.s);ctx.fill();
    ctx.restore();
  }
  for(const cr of CRYSTALS){
    const pl=.5+.5*Math.sin(time*1.6+cr.ph);
    ctx.globalAlpha=(.10+.14*pl)*q.glow;
    const g=ctx.createRadialGradient(cr.x,cr.y,1,cr.x,cr.y,cr.s*3.2);
    g.addColorStop(0,hexA(cr.col,.8));g.addColorStop(1,hexA(cr.col,0));
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(cr.x,cr.y,cr.s*3.2,0,TAU);ctx.fill();
  }
  ctx.restore();
}

/* ---------- MK-IV abilities ---------- */
function fireAbility(t){
  const b=TOWERS[t.key];
  t.abCd=b.abCd; sfx('abil');
  if(t.key==='bolt'){ t.odT=6;
    floaters.push({x:t.x,y:t.y-30,txt:'OVERDRIVE',life:1,color:'#ffb8ec'}); }
  else if(t.key==='frost'){
    sfx('nova');
    for(const c of creeps){
      if(c.dead)continue;
      if(Math.hypot(c.x-t.x,c.y-t.y)<150){applySlow(c,.22,2.5);
        frostFx.push({x:c.x,y:c.y,t:0,dur:.45,s:20});}
    }
    rings.push({x:t.x,y:t.y,r:10,vr:320,life:.5,max:.5,color:'#9fdcff'});
    rings.push({x:t.x,y:t.y,r:4,vr:200,life:.6,max:.6,color:'#eaf9ff'});
    floaters.push({x:t.x,y:t.y-30,txt:'FROST NOVA',life:1,color:'#d8f4ff'});
  }
  else if(t.key==='mortar'){
    const tgt=pickTarget(t)||creeps[0];
    if(tgt){
      const ix=tgt.x,iy=tgt.y;
      for(let i=0;i<5;i++){
        const a=i*TAU/5,r=i===0?0:42;
        const tx=ix+Math.cos(a)*r,ty=iy+Math.sin(a)*r;
        const ft=Math.hypot(tx-t.x,ty-t.y)/TOWERS.mortar.pspeed;
        shells.push({sx:t.x+Math.cos(t.ang)*10,sy:t.y+Math.sin(t.ang)*10,
          tx,ty,t:0,ft,dmg:statDmg(t)*.7,splash:46,src:t});
      }
      sfx('mortar');
      floaters.push({x:t.x,y:t.y-30,txt:'CLUSTER!',life:1,color:'#ff9a5c'});
    }
  }
  else if(t.key==='rail'){
    const tgt=pickTarget(t);
    if(tgt){
      const ang=Math.atan2(tgt.y-t.y,tgt.x-t.x);
      const maxD=statRange(t)+60;
      const hits=creeps.filter(c=>!c.dead)
        .map(c=>{
          const rx=c.x-t.x,ry=c.y-t.y;
          const proj=rx*Math.cos(ang)+ry*Math.sin(ang);
          const perp=Math.abs(-rx*Math.sin(ang)+ry*Math.cos(ang));
          return {c,proj,perp};
        })
        .filter(h=>h.perp<26&&h.proj>0&&h.proj<maxD)
        .sort((a2,b2)=>a2.proj-b2.proj).slice(0,3);
      const endD=hits.length?hits[hits.length-1].proj+40:maxD;
      const mx=t.x+Math.cos(ang)*26,my=t.y+Math.sin(ang)*26;
      for(const h of hits) hurt(h.c,statDmg(t),{pierce:true,src:t});
      beams.push({x1:mx,y1:my,x2:t.x+Math.cos(ang)*endD,y2:t.y+Math.sin(ang)*endD,life:.22,max:.22});
      sfx('rail');
      floaters.push({x:t.x,y:t.y-30,txt:'VOLLEY ×'+hits.length,life:1,color:'#ff8aa4'});
    }
  }
  else if(t.key==='tesla'){
    sfx('nova');
    let last={x:t.x,y:t.y};
    const hitSet=new Set();
    let dmg=statDmg(t);
    for(let i=0;i<10;i++){
      let best=null,bd=110;
      for(const c of creeps){
        if(c.dead||hitSet.has(c))continue;
        const d=Math.hypot(c.x-last.x,c.y-last.y);
        if(d<bd){bd=d;best=c;}
      }
      if(!best)break;
      hitSet.add(best);
      hurt(best,dmg,{src:t});
      zaps.push({pts:jagged(last.x,last.y,best.x,best.y,Math.floor(time*60)+i),life:.16,max:.16});
      last={x:best.x,y:best.y};
    }
    floaters.push({x:t.x,y:t.y-30,txt:'STORM ×'+hitSet.size,life:1,color:'#d8fff8'});
  }
}

function sanitizeLoaded(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return null;
  const v=(d.v===2||d.v===1)?1:0; // v1 & v2 share field shapes; v2 adds `at`
  if(!v)return null;
  const num=(x,lo,hi,def)=>Number.isFinite(x)?Math.round(Math.min(hi,Math.max(lo,x))):def;
  const o={v:2,at:Number.isFinite(d.at)?d.at:0,
    lives:num(d.lives,0,999,START_LIVES),
    gold:num(d.gold,0,1e9,START_GOLD),
    waveNum:num(d.waveNum,0,1e6,0),
    cleared:num(d.cleared,0,1e6,0),
    endless:!!d.endless,
    kills:num(d.kills,0,1e9,0),
    goldEarned:num(d.goldEarned,0,1e9,0),
    bestWave:num(d.bestWave,0,1e6,0),
    towers:[]};
  if(d.towers!==undefined&&!Array.isArray(d.towers))o.towers=[];
  else if(Array.isArray(d.towers)){
    for(const td of d.towers.slice(0,400)){
      if(!td||typeof td!=='object'||!TOWERS[td.key])continue;
      const c=td.c|0,r=td.r|0;
      if(c<0||c>=COLS||r<0||r>=ROWS)continue;
      if(!Number.isFinite(td.invested)||td.invested<0)continue;
      o.towers.push({key:td.key,c,r,
        dmgLv:Math.min(3,Math.max(0,td.dmgLv|0)),
        rateLv:Math.min(3,Math.max(0,td.rateLv|0)),
        invested:Math.round(td.invested),
        mode:['first','strong','last'].includes(td.mode)?td.mode:'first',
        kills:Math.max(0,td.kills|0)});
    }
  }
  const m=(d.MOD&&typeof d.MOD==='object')?d.MOD:{};
  const M={};
  for(const k of ['rangeMul','bountyMul','rateMul','dmgMul','frostDmgMul','slowTAdd','sellRefund','costMul','clearBonusMul','upgCost','blueprints','disableRecovery','comboBonus','_chillWeaken']){
    const val=m[k];
    if(typeof val==='number'&&isFinite(val))M[k]=val;
  }
  o.MOD=M;
  return o;
}
function probeSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    try{
      const d=JSON.parse(raw);

      if(s&&(s.towers.length||s.waveNum||s.cleared))return{ok:true,data:s};
      return{ok:false};
    }catch(e){return{ok:false};}
  }catch(e){return null;}
}

/* ---------- autosave (▲ GLM: schema v2 + throttled + forced milestones) ---------- */
let lastSave=0;
function saveGame(force){
  if(state!=='play'&&state!=='cards')return;
  const n=performance.now();
  if(!force&&n-lastSave<4000)return;
  lastSave=n;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      v:2,at:Date.now(),
      lives,gold:Math.round(gold),waveNum,cleared,endless,kills,goldEarned,bestWave,
      MOD:{...MOD},
      towers:towers.map(t=>({key:t.key,c:t.c,r:t.r,dmgLv:t.dmgLv,rateLv:t.rateLv,
        invested:t.invested,mode:t.mode,kills:t.kills||0})),
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY));
    const s=sanitizeLoaded(d);
    if(!s)return false;
    if(DEBUG)console.info('[BASTION] loaded schema v'+(d&&d.v)+' → migrated to v2');
    resetState();
    lives=s.lives;gold=s.gold;waveNum=s.waveNum;cleared=s.cleared;
    endless=!!s.endless;kills=s.kills;goldEarned=s.goldEarned;
    Object.assign(MOD,s.MOD);
    for(const td of s.towers){
      const t={key:td.key,c:td.c,r:td.r,x:(td.c+.5)*CELL,y:(td.r+.5)*CELL,ang:-Math.PI/2,
        cool:0,dmgLv:td.dmgLv,rateLv:td.rateLv,invested:td.invested,mode:td.mode,
        flash:0,recoil:0,spin:0,kills:td.kills,abCd:0,odT:0,disabledT:0};
      towers.push(t);towerAt.set(td.c+','+td.r,t);
    }
    idleOn=true;idleTimer=12;waveActive=false;
    renderPreview(waveNum+1);renderInspector();
    return true;
  }catch(e){return false;}
}

/* ---------- game actions ---------- */
function resetState(){
  lives=START_LIVES;gold=START_GOLD;kills=0;goldEarned=0;
  waveNum=0;cleared=0;waveActive=false;endless=false;spawnQ=[];spawnI=0;spawnClock=0;
  idleTimer=0;idleOn=false;paused=false;speedMul=1;$('speedBtn').textContent='1×';
  $('pauseBtn').innerHTML=IC.pause;
  creeps=[];towers=[];projs=[];shells=[];beams=[];zaps=[];parts=[];floaters=[];rings=[];booms=[];frostFx=[];empFx=[];
  towerAt.clear();sel=null;placing=null;hoverTower=null;shake=0;gateFlash=0;
  combo=0;comboT=0;comboMult=1;
  MOD.rangeMul=1;MOD.bountyMul=1;MOD.rateMul=1;MOD.dmgMul=1;MOD.frostDmgMul=1;
  MOD.slowTAdd=0;MOD.sellRefund=.7;MOD.costMul=1;MOD.clearBonusMul=1;MOD.upgCost=1;
  MOD.blueprints=0;MOD.disableRecovery=1;MOD.comboBonus=0;MOD._chillWeaken=1;
  /* ▲ GLM PHASE 28 — cosmetic systems also reset to a clean session. */
  echoes.length=0; cardPool=[]; bossVignette=0; bossDieFx=null; frameErr=0;
  GRNG.set((((Date.now()^performance.now())>>>0)%2147483646)+1);
  const cp=$('cancelPlace');if(cp)cp.hidden=true;
  renderPreview(1);renderInspector();
}
function setPlacing(k){
  placing=k;if(k)sel=null;renderInspector();
  const cp=$('cancelPlace');
  if(cp)cp.hidden=!(placing&&(lastTouch||matchMedia('(pointer:coarse)').matches));
}
function canPlace(c,r){return c>=0&&c<COLS&&r>=0&&r<ROWS&&!pathSet.has(c+','+r)&&!towerAt.has(c+','+r);}
function startWave(){
  if(waveActive||state!=='play')return;
  if(idleOn&&idleTimer>0.5){
    const bonus=Math.floor(idleTimer)*2;
    if(bonus>0){gold+=bonus;goldEarned+=bonus;
      floaters.push({x:GATE.x-6,y:GATE.y-40,txt:'+'+bonus,life:1.2,color:'#f2b45c'});}
  }
  waveNum++;idleOn=false;curMod=waveMod(waveNum);
  const def=waveDef(waveNum);hpMul=def.hp;
  spawnQ=[];let t=.8;
  for(const g of def.groups){for(let i=0;i<g.n;i++){spawnQ.push({t,type:g.t});t+=g.gap;}t+=1.2;}
  spawnI=0;spawnClock=0;waveActive=true;
  renderPreview(waveNum+1);
  const modTxt=curMod?' · '+WMODS[curMod].label:'';
  showBanner('WAVE '+waveNum+modTxt,
    (def.boss?'BOSS SIGNATURES DETECTED':'HOSTILES INBOUND')+(curMod?' — '+WMODS[curMod].desc:''),
    def.boss?'bad':'');
  sfx(def.boss?'boss':'horn');
  rings.push({x:BREACH.x,y:BREACH.y,r:8,vr:110,life:.7,max:.7,color:TPAL.breach});
}
function endWave(){
  waveActive=false;cleared++;curMod=null;
  const b=Math.round((26+waveNum*4)*MOD.clearBonusMul);
  gold+=b;goldEarned+=b;
  saveGame(true);
  if(!endless&&cleared>=MAXW){ bestWave=Math.max(bestWave,cleared); saveBest(bestWave);
    state='win'; sfx('winT'); showOverlay('win'); return; }
  idleTimer=12;idleOn=true;
  if(cleared%5===0&&waveNum<900){ showBanner('WAVE CLEARED','+'+b+' GOLD — PROTOCOL CHOICE'); offerCards(); }
  else showBanner('WAVE CLEARED','+'+b+' GOLD — NEXT IN 12s');
  sfx('clear');
}
function doSpawn(type){
  const base=CREEPS[type];
  /* ▲ GLM: elite roll + lane offset are gameplay-affecting → seeded GRNG. */
  const elite=waveNum>=10&&type!=='warden'&&type!=='boss'&&type!=='saboteur'&&GRNG.f()<Math.min(.45,.14+waveNum*.011);
  let hpm=hpMul*(elite?1.5:1), spm=base.spd*(elite?1.25:1);
  let armor=base.armor||0;
  if(curMod==='armored')armor+=2;
  if(curMod==='haste')spm*=1.2;
  creeps.push({
    type,elite,
    hp:Math.round(base.hp*hpm),maxhp:Math.round(base.hp*hpm),
    spd:spm,r:base.r,armor,lives:base.lives,regen:base.regen||0,
    mregen:curMod==='comrades'?.015:0,
    bounty:Math.round(base.b*(1+(waveNum-1)*.06)*(elite?1.6:1)),
    dist:0,x:WAY[0].x,y:WAY[0].y,dx:1,dy:0,
    lane:(GRNG.f()-.5)*12,slowF:1,slowT:0,flash:0,lastHit:-99,
    seed:CRAND()*6.28,
    shieldOn:false,shieldCd:6,empCd:8,enraged:false,
    sabT:0,chan:null,chanT:0,
  });
  if(type==='boss'){
    /* ▲ GLM PHASE 16 — entrance presentation (spawn timing untouched). */
    sfx('boss'); addShake(2);
    bossVignette=1;
    rings.push({x:BREACH.x,y:BREACH.y,r:8,vr:90,life:.6,max:.6,color:TPAL.breach});
    rings.push({x:BREACH.x,y:BREACH.y,r:4,vr:150,life:.8,max:.8,color:'#d16bff'});
    const q=Q();
    if(ART.motion)for(let i=0;i<14*q.glow;i++){
      const a=CRAND()*TAU;
      parts.push({x:BREACH.x,y:BREACH.y,vx:Math.cos(a)*(60+CRAND()*90),vy:Math.sin(a)*(60+CRAND()*90)-40,
        life:.6+CRAND()*.3,max:.9,color:'#d16bff',s:2.4,rot:a,vr:4,petal:true});
    }
  }
}
function disableTower(t,dur){
  if(t.disabledT<=0){
    t.disabledT=dur;
    floaters.push({x:t.x,y:t.y-28,txt:'DISABLED',life:.9,color:'#ff9a5c'});
  }else t.disabledT=Math.max(t.disabledT,dur);
}
function leak(c){
  c.dead=true;lives-=c.lives;gateFlash=.6;addShake(3);
  floaters.push({x:GATE.x-8,y:GATE.y-34,txt:'-'+c.lives,life:1,color:TPAL.breach});
  const ef=$('edgeFlash');ef.classList.remove('on');void ef.offsetWidth;ef.classList.add('on');
  const lv=$('livesV');lv.classList.remove('hurt');void lv.offsetWidth;lv.classList.add('hurt');
  sfx('leak');
  if(lives<=0){
    lives=0;state='over';
    bestWave=Math.max(bestWave,cleared);saveBest(bestWave);
    try{localStorage.removeItem(SAVE_KEY);}catch(e){}
    sfx('lose');showOverlay('over');
  }
}
function applySlow(c,f,t){
  const eff=c.type==='boss'?1-(1-f)*.55:f;
  c.slowF=c.slowT>0?Math.min(c.slowF,eff):eff;
  c.slowT=Math.max(c.slowT,t);
}
function hurt(c,dmg,o={}){
  if(c.dead)return;
  if(c.shieldOn&&!o.pierce){
    c.flash=.05;sfxAt('block',c.x);
    if(Math.random()<.2)floaters.push({x:c.x,y:c.y-c.r-16,txt:'BLOCKED',life:.5,color:'#9fd8e8'});
    return;
  }
  const eff=Math.max(1,dmg-(o.pierce?0:(c.armor||0)));
  c.hp-=eff;c.flash=.09;c.lastHit=time;sfxAt('hit',c.x);
  if(c.hp<=0){
    c.dead=true;kills++;
    if(o.src)o.src.kills=(o.src.kills||0)+1;
    combo++;comboT=2;
    comboMult=1+Math.min(1.2,combo*.08*(1+MOD.comboBonus*20)) + MOD.comboBonus;
    const b=Math.round(c.bounty*MOD.bountyMul*comboMult);
    gold+=b;goldEarned+=b;
    floaters.push({x:c.x,y:c.y-16,txt:'+'+b,life:1,color:'#f2b45c',coin:comboMult<1.6});
    burst(c);
    if(c.type==='boss'){
      /* ▲ GLM PHASE 16 — layered defeat VFX (rewards already granted above). */
      addShake(6);sfx('bossdie');
      booms.push({x:c.x,y:c.y,t:0,dur:.4,s:30});
      booms.push({x:c.x,y:c.y,t:-.09,dur:.45,s:44});
      booms.push({x:c.x,y:c.y,t:-.18,dur:.5,s:58});
      rings.push({x:c.x,y:c.y,r:6,vr:340,life:.7,max:.7,color:'#d16bff'});
      rings.push({x:c.x,y:c.y,r:2,vr:200,life:.9,max:.9,color:'#ffb8ec'});
      bossDieFx={t:0,dur:.8,x:c.x,y:c.y};
      for(let i=0;i<14*Q().glow;i++){
        const a=CRAND()*TAU;
        parts.push({x:c.x,y:c.y,vx:Math.cos(a)*(90+CRAND()*130),vy:Math.sin(a)*(90+CRAND()*130)-60,
          life:.6+CRAND()*.4,max:1,color:'#f2b45c',s:2.6,rot:a,vr:6,petal:true});
      }
    }
    sfxAt('coin',c.x);
  }
}
/* ▲ GLM PHASE 15 — personality-driven death remnants.
   Called strictly AFTER logical death/rewards in hurt(); 100% cosmetic. */
function burst(c){
  const col=CREEPC[c.type];
  const q=Q(),room=parts.length<q.parts;
  const n0=c.type==='boss'?26:(c.type==='swarm'?6:10);
  const n=room?n0:Math.ceil(n0/3);
  for(let i=0;i<n;i++){
    const a=CRAND()*TAU,sp=40+CRAND()*100;
    parts.push({x:c.x,y:c.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,
      life:.4+CRAND()*.35,max:.75,color:col,s:1.5+CRAND()*2.5,
      rot:CRAND()*3,vr:(CRAND()-.5)*10,petal:CRAND()<.5});
  }
  rings.push({x:c.x,y:c.y,r:2,vr:150,life:.28,max:.28,color:col});
  if(room)for(let i=0;i<3;i++)parts.push({x:c.x,y:c.y,vx:(CRAND()-.5)*30,
    vy:-50-CRAND()*40,life:.5,max:.5,color:'',s:6+CRAND()*4,
    rot:-Math.PI/2,vr:0,flame:true});
  if(room)parts.push({x:c.x,y:c.y,vx:0,vy:-30,life:.22,max:.22,color:'',s:c.type==='boss'?22:12,
    rot:-Math.PI/2,vr:0,flame:true});
  if(!room||!ART.motion)return;
  switch(c.type){
    case 'brute': case 'warden': case 'saboteur':
      for(let i=0;i<5;i++)parts.push({x:c.x,y:c.y-6,vx:(CRAND()-.5)*130,vy:-CRAND()*90,
        life:.5,max:.5,color:'#b9c2cf',s:2.6,rot:CRAND()*3,vr:6,petal:false});
      rings.push({x:c.x,y:c.y,r:4,vr:70,life:.5,max:.5,color:'#8f96a8'});
      break;
    case 'shade':
      for(let i=0;i<7;i++)parts.push({x:c.x+(CRAND()-.5)*16,y:c.y-CRAND()*30,
        vx:(CRAND()-.5)*16,vy:-34-CRAND()*30,life:.7,max:.7,
        color:'rgba(154,107,216,.55)',s:2.2,rot:0,vr:2,petal:true});
      break;
    case 'runner': case 'soldier':
      for(let i=0;i<4;i++)parts.push({x:c.x,y:c.y,
        vx:c.dx*150*(0.5+CRAND()*.7),vy:c.dy*150*(0.5+CRAND()*.7)-20,
        life:.28,max:.28,color:col,s:2,rot:0,vr:0,petal:false});
      break;
  }
  if(c.elite){
    rings.push({x:c.x,y:c.y,r:8,vr:210,life:.45,max:.45,color:'#ff9de2'});
    for(let i=0;i<8;i++){const a=i*TAU/8;
      parts.push({x:c.x,y:c.y,vx:Math.cos(a)*130,vy:Math.sin(a)*130-40,
        life:.5,max:.5,color:'#ff9de2',s:3,rot:a,vr:5,petal:true});}
  }
}

/* ---------- combat ---------- */
function pickTarget(t){
  let best=null,bv=-Infinity;
  const rng=statRange(t);
  for(const c of creeps){
    if(c.dead)continue;
    if(Math.hypot(c.x-t.x,c.y-t.y)>rng+c.r*.5)continue;
    const v=t.mode==='first'?c.dist:t.mode==='strong'?c.hp:-c.dist;
    if(v>bv){bv=v;best=c;}
  }
  return best;
}
function teslaFire(t,target){
  const b=TOWERS[t.key];
  const chains=[4,5,6,8][t.dmgLv]+(t.abT>0?4:0);
  let last={x:t.x,y:t.y-10};
  let dmg=statDmg(t);
  const hitSet=new Set();
  for(let i=0;i<chains;i++){
    hurt(target,dmg*Math.pow(.75,i),{src:t});
    zaps.push({pts:jagged(last.x,last.y,target.x,target.y,Math.floor(time*60)+i),life:.15,max:.15});
    hitSet.add(target);
    last={x:target.x,y:target.y};
    let best=null,bd=95;
    for(const c of creeps){
      if(c.dead||hitSet.has(c))continue;
      const d=Math.hypot(c.x-last.x,c.y-last.y);
      if(d<bd){bd=d;best=c;}
    }
    if(!best)break;
    target=best;
  }
  sfxAt('zap',t.x);
}
function fire(t,target){
  const b=TOWERS[t.key],dmg=statDmg(t);
  if(t.key!=='frost'&&t.key!=='tesla') t.ang=Math.atan2(target.y-t.y,target.x-t.x);
  else if(t.key==='frost') t.spin+=6;
  t.recoil=3;t.flash=.06;
  if(b.kind==='beam'){
    const mx=t.x+Math.cos(t.ang)*26,my=t.y+Math.sin(t.ang)*26;
    hurt(target,dmg,{pierce:true,src:t});
    beams.push({x1:mx,y1:my,x2:target.x,y2:target.y,life:.14,max:.14});
    sfx('rail');
  }else if(b.kind==='shell'){
    const mx=t.x+Math.cos(t.ang)*10,my=t.y+Math.sin(t.ang)*10;
    const ft=Math.hypot(target.x-t.x,target.y-t.y)/b.pspeed;
    const fut=posAt(target.dist+target.spd*(target.slowT>0?target.slowF:1)*ft);
    shells.push({sx:mx,sy:my,tx:fut.x,ty:fut.y,t:0,ft,dmg,splash:b.splash,src:t});
    for(let i=0;i<3;i++)parts.push({x:mx,y:my,vx:(Math.random()-.5)*30,
      vy:-20-Math.random()*20,life:.5,max:.5,color:'rgba(170,160,180,.45)',
      s:3+Math.random()*2,rot:Math.random()*3,vr:1,petal:false});
    sfx('mortar');
  }else if(b.kind==='chain'){
    teslaFire(t,target);
  }else{
    const mx=t.x+Math.cos(t.ang)*20,my=t.y+Math.sin(t.ang)*20;
    projs.push({kind:b.kind,x:mx,y:my,ang:t.ang,spd:b.pspeed,dmg,target,src:t,
      slowF:chillF(),slowT:b.slowT+MOD.slowTAdd,trav:0});
    sfxAt(b.kind==='shard'?'frost':'shoot',t.x);
  }
}
function explode(s){
  sfxAt('boom',s.tx);addShake(2.5);
  booms.push({x:s.tx,y:s.ty,t:0,dur:.34,s:24});
  rings.push({x:s.tx,y:s.ty,r:4,vr:240,life:.32,max:.32,color:'#f2b45c'});
  for(let i=0;i<4;i++)parts.push({x:s.tx,y:s.ty,vx:(Math.random()-.5)*60,
    vy:-60-Math.random()*40,life:.55,max:.55,color:'',s:8+Math.random()*5,
    rot:-Math.PI/2,vr:0,flame:true});
  for(const c of creeps){
    if(c.dead)continue;
    const d=Math.hypot(c.x-s.tx,c.y-s.ty);
    if(d<=s.splash)hurt(c,s.dmg*(1-.55*(d/s.splash)),{src:s.src});
  }
}

/* ---------- update ---------- */
function update(dt){
  if(waveActive){
    spawnClock+=dt;
    while(spawnI<spawnQ.length&&spawnQ[spawnI].t<=spawnClock){doSpawn(spawnQ[spawnI].type);spawnI++;}
  }
  for(const c of creeps){
    if(c.dead)continue;
    if(c.regen&&time-c.lastHit>2&&c.hp<c.maxhp)c.hp=Math.min(c.maxhp,c.hp+c.regen*dt);
    if(c.mregen&&c.hp<c.maxhp)c.hp=Math.min(c.maxhp,c.hp+c.maxhp*c.mregen*dt);
    if(c.type==='boss'){
      if(Math.random()<dt*8*Q().glow)
        parts.push({x:c.x+(Math.random()-.5)*34,y:c.y-18+(Math.random()-.5)*34,
          vx:(Math.random()-.5)*20,vy:-40-Math.random()*30,life:.5,max:.5,
          color:'#ff6bd8',s:2.2,rot:0,vr:3,petal:true});
      if(!c.enraged&&c.hp<c.maxhp*.5){
        c.enraged=true;c.spd*=1.35;
        sfx('boss');
        rings.push({x:c.x,y:c.y,r:6,vr:200,life:.5,max:.5,color:'#ff5c7a'});
        floaters.push({x:c.x,y:c.y-40,txt:'ENRAGED!',life:1,color:'#ff5c7a'});
        bossVignette=Math.max(bossVignette,.6);
      }
      const tier=Math.floor(waveNum/5);
      if(tier>=3){
        c.shieldCd-=dt;
        if(c.shieldOn){c.shieldT-=dt;if(c.shieldT<=0)c.shieldOn=false;}
        else if(c.shieldCd<=0){c.shieldOn=true;c.shieldT=3;c.shieldCd=9;
          floaters.push({x:c.x,y:c.y-40,txt:'SHIELD',life:.8,color:'#9fd8e8'});}
      }
      if(tier>=5){
        c.empCd-=dt;
        if(c.empCd<=0){
          c.empCd=12;sfx('emp');addShake(4);
          rings.push({x:c.x,y:c.y,r:10,vr:420,life:.6,max:.6,color:'#d16bff'});
          empFx.push({x:c.x,y:c.y,t:0,dur:.6,s:180});
          for(const t of towers)
            if(Math.hypot(t.x-c.x,t.y-c.y)<180)disableTower(t,2.5);
        }
      }
    }
    if(c.type==='saboteur'){
      c.sabT-=dt;
      if(!c.chan&&c.sabT<=0){
        let best=null,bd=130;
        for(const t of towers){
          if(t.disabledT>0)continue;
          const d=Math.hypot(t.x-c.x,t.y-c.y);
          if(d<bd){bd=d;best=t;}
        }
        if(best){c.chan=best;c.chanT=1.1;}
      }
      if(c.chan){
        if(c.chan.dead){c.chan=null;continue;}
        c.chanT-=dt;
        if(Math.random()<.3)parts.push({x:c.x+(c.chan.x-c.x)*.5,y:c.y+(c.chan.y-c.y)*.5-10,
          vx:(Math.random()-.5)*30,vy:-20,life:.2,max:.2,color:'#ff9a5c',s:2,rot:0,vr:6,petal:true});
        if(c.chanT<=0){
          projs.push({kind:'sabot',x:c.x,y:c.y-20,tx:c.chan.x,ty:c.chan.y,t:0,ft:.22,tower:c.chan});
          c.sabT=4;c.chan=null;
        }
        continue;
      }
    }
    const sf=c.slowT>0?c.slowF:1;
    c.slowT-=dt;c.flash-=dt;
    c.dist+=c.spd*sf*dt;
    if(c.dist>=PATHLEN){leak(c);continue;}
    const p=posAt(c.dist);c.dx=p.dx;c.dy=p.dy;
    c.x=p.x-p.dy*c.lane;c.y=p.y+p.dx*c.lane;
  }
  creeps=creeps.filter(c=>!c.dead);
  if(waveActive&&spawnI>=spawnQ.length&&creeps.length===0)endWave();
  if(!waveActive&&idleOn){idleTimer-=dt;if(idleTimer<=0){idleTimer=0;startWave();}}
  if(combo>0){comboT-=dt;if(comboT<=0){combo=0;comboMult=1;}}
  for(const t of towers){
    t.cool-=dt;t.flash-=dt;t.recoil=Math.max(0,t.recoil-18*dt);
    t.spin=t.spin||0;
    t.abCd=Math.max(0,t.abCd-dt);
    t.odT=Math.max(0,(t.odT||0)-dt);
    if(t.disabledT>0){
      t.disabledT-=dt*MOD.disableRecovery;
      if(Math.random()<.25&&parts.length<Q().parts)parts.push({x:t.x+(Math.random()-.5)*26,y:t.y+(Math.random()-.5)*26,
        vx:(Math.random()-.5)*40,vy:-30,life:.2,max:.2,color:'#ff9a5c',s:2,rot:0,vr:8,petal:true});
      continue;
    }
    const tgt=pickTarget(t);
    if(tgt){
      if(t.key!=='frost'&&t.key!=='tesla'){
        let d=Math.atan2(tgt.y-t.y,tgt.x-t.x)-t.ang;
        d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
        t.ang+=d*Math.min(1,10*dt);
      }
      if(t.cool<=0){fire(t,tgt);t.cool=1/statRate(t);}
    }else{
      if(t.key!=='frost'&&t.key!=='tesla')t.ang+=dt*.5;
      if(t.cool<0)t.cool=0;
    }
    t.spin=Math.max(0,(t.spin||0)-8*dt);
  }
  for(const p of projs){
    if(p.kind==='sabot'){
      p.t+=dt;
      if(p.t>=p.ft){p.dead=true;
        if(p.tower){disableTower(p.tower,2.5);sfx('deny');
          booms.push({x:p.tower.x,y:p.tower.y,t:0,dur:.25,s:12});}
      }
      continue;
    }
    if(p.target&&!p.target.dead)p.ang=Math.atan2(p.target.y-p.y,p.target.x-p.x);
    p.x+=Math.cos(p.ang)*p.spd*dt;p.y+=Math.sin(p.ang)*p.spd*dt;p.trav+=p.spd*dt;
    if(p.kind==='dart'&&Math.random()<.3&&parts.length<Q().parts)
      parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.12,max:.12,color:'#f2b45c',s:1.6,rot:0,vr:0,petal:false});
    if(p.target&&!p.target.dead&&Math.hypot(p.target.x-p.x,p.target.y-p.y)<p.target.r+5){
      if(p.kind==='shard'){applySlow(p.target,p.slowF,p.slowT);
        frostFx.push({x:p.target.x,y:p.target.y,t:0,dur:.3,s:14});}
      hurt(p.target,p.dmg,{src:p.src});
      p.dead=true;continue;
    }
    if(p.trav>520||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)p.dead=true;
  }
  projs=projs.filter(p=>!p.dead);
  for(const s of shells){
    s.t+=dt;
    const p=Math.min(1,s.t/s.ft),x=s.sx+(s.tx-s.sx)*p,y0=s.sy+(s.ty-s.sy)*p;
    if(Math.random()<.5&&parts.length<Q().parts)parts.push({x,y:y0-Math.sin(p*Math.PI)*34,vx:(Math.random()-.5)*8,
      vy:-12,life:.32,max:.32,color:'#a59eb4',s:2.6,rot:Math.random()*3,vr:2,petal:false});
    if(Math.random()<.5&&parts.length<Q().parts)parts.push({x,y:y0-Math.sin(p*Math.PI)*34,vx:(Math.random()-.5)*10,
      vy:-6,life:.14,max:.14,color:'',s:5,rot:Math.PI+(Math.random()-.5)*.4,vr:0,flame:true});
    if(s.t>=s.ft){s.dead=true;explode(s);}
  }
  shells=shells.filter(s=>!s.dead);
  for(const b of beams)b.life-=dt;beams=beams.filter(b=>b.life>0);
  for(const z of zaps)z.life-=dt;zaps=zaps.filter(z=>z.life>0);
  for(const b of booms)b.t+=dt;booms=booms.filter(b=>b.t<b.dur);
  for(const f of frostFx)f.t+=dt;frostFx=frostFx.filter(f=>f.t<f.dur);
  for(const f of empFx)f.t+=dt;empFx=empFx.filter(f=>f.t<f.dur);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;p.rot+=p.vr*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  /* ▲ GLM PHASE 11 — quality-aware caps + floater/ring ceilings (leak guards). */
  const pc=Q().parts;
  if(parts.length>pc)parts.splice(0,parts.length-pc);
  for(const f of floaters){f.y-=28*dt;f.life-=dt;}
  floaters=floaters.filter(f=>f.life>0);
  if(floaters.length>90)floaters.splice(0,floaters.length-90);
  for(const r of rings){r.r+=r.vr*dt;r.life-=dt;}
  rings=rings.filter(r=>r.life>0);
  if(rings.length>120)rings.splice(0,rings.length-120);
}

/* ---------- render ---------- */
function drawCreep(c){
  const k=SCALE[c.type]*(c.elite?1.06:1);
  const moving=c.spd>0&&!(c.chan);
  const isEl=c.elite&&ELITE_OF[c.type];
  let fr;
  if(c.type==='shade')fr=c.elite?SPR.shadeEl:SPR.shade;
  else if(c.type==='boss'){
    /* ▲ boss walk animation — 12-frame stomp cycle, faster when enraged.
       Falls back to the static silhouette under reduced motion. */
    const run=(ART.motion&&SPR.bossRun&&SPR.bossRun.length)?SPR.bossRun:null;
    fr=(moving&&run)?run[Math.floor(time*(c.enraged?19:13)+c.seed*2)%run.length]:SPR.boss;
  }
  else{
    const key=isEl?'elite':c.type;
    fr=moving?SPR.mech[key][Math.floor((ART.motion?time:0)*40+c.seed)%SPR.mech[key].length]:SPR.mech[key+'_s'];
  }
  if(moving&&state==='play'&&!paused&&Math.random()<.05&&parts.length<Q().parts){
    parts.push({x:c.x+(Math.random()-.5)*8,y:c.y+13*k,vx:(Math.random()-.5)*14,
      vy:-8-Math.random()*10,life:.4,max:.4,color:hexA(TPAL.speck,.3),
      s:1.6+Math.random()*1.4,rot:Math.random()*3,vr:1,petal:false});
  }
  ctx.save();ctx.globalAlpha=.24;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(c.x,c.y+16*k,17*k,5.5*k,0,0,TAU);ctx.fill();ctx.restore();
  const flip=c.dx<0;
  let hover=0;
  if(c.type==='shade')hover=Math.sin(time*3+c.seed)*2.5;
  /* ▲ boss: vertical bob now lives inside the walk cycle itself —
     only apply the old float when static (reduced motion). */
  else if(c.type==='boss')hover=(moving&&ART.motion&&SPR.bossRun&&SPR.bossRun.length)?0:Math.abs(Math.sin(time*4+c.seed))*1.6;
  if(c.type==='shade'){
    for(let a2=2;a2>=1;a2--){
      ctx.save();ctx.globalAlpha=a2===2?.14:.3;
      ctx.translate(c.x-c.dx*8*k*a2,c.y-c.dy*8*k*a2+hover);
      if(flip)ctx.scale(-1,1);
      ctx.drawImage(fr,-AX*k,-AY*k,FW*k,FH*k);
      ctx.restore();
    }
  }
  ctx.save();ctx.translate(c.x,c.y+hover);
  if(flip)ctx.scale(-1,1);
  if(c.enraged){ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.18+.1*Math.sin(time*8);
    ctx.fillStyle='#ff5c7a';ctx.beginPath();ctx.arc(0,-30*k,34*k,0,TAU);ctx.fill();ctx.restore();}
  ctx.drawImage(fr,-AX*k,-AY*k,FW*k,FH*k);
  ctx.restore();
  ctx.save();ctx.translate(c.x,c.y);
  if(c.elite){
    ctx.globalAlpha=.6+.3*Math.sin(time*4+c.seed);
    auraRing(ctx,0,0,c.r+8,'#ff6bd8');
    ctx.globalAlpha=.9;
    for(let i=0;i<3;i++){
      const a=time*2+i*TAU/3;
      ctx.save();ctx.translate(Math.cos(a)*(c.r+10),Math.sin(a)*(c.r+10)*.55-10);ctx.rotate(a);
      diamondPath(ctx,2.5);ctx.fillStyle='#ffb8ec';ctx.fill();ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  if(c.type==='warden'){
    ctx.globalAlpha=.8;wardRing(ctx,0,15*k,c.r+7);ctx.globalAlpha=1;
    if(c.regen&&time-c.lastHit>2&&c.hp<c.maxhp)
      plusPip(ctx,0,-34*k-14,8,SPAL.green);
  }
  if(c.type==='boss'){
    ctx.save();ctx.globalAlpha=.5;ctx.strokeStyle=hexA('#d16bff',.4);ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){const a2=i*TAU/5+.3;
      ctx.beginPath();ctx.moveTo(Math.cos(a2)*14,Math.sin(a2)*14);
      ctx.lineTo(Math.cos(a2)*(c.r+14),Math.sin(a2)*(c.r+14));ctx.stroke();}
    ctx.restore();
    for(let i=0;i<6;i++){
      const a2=time*.6+i*TAU/6;
      ctx.save();ctx.translate(Math.cos(a2)*(c.r+6),Math.sin(a2)*(c.r+6));ctx.rotate(a2);
      diamondPath(ctx,4);ctx.fillStyle='#d16bff';ctx.fill();
      ctx.strokeStyle=SPAL.ol;ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }
    if(c.shieldOn){
      ctx.save();ctx.globalAlpha=.5+.2*Math.sin(time*6);
      ctx.strokeStyle='#9fd8e8';ctx.lineWidth=2.5;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a2=i*TAU/6+time*.5;
        const px=Math.cos(a2)*(c.r+11),py=Math.sin(a2)*(c.r+11);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.stroke();ctx.restore();
    }
  }
  if(c.type==='saboteur'&&c.chan){
    ctx.save();ctx.strokeStyle=hexA('#ff9a5c',.5+.3*Math.sin(time*12));
    ctx.lineWidth=1.2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(c.chan.x-c.x,c.chan.y-c.y-10);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  if(c.slowT>0){
    ctx.strokeStyle=hexA(SPAL.ice,.85);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,c.r+3,0,TAU);ctx.stroke();
  }
  if(c.flash>0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=Math.min(1,c.flash/.09)*.65;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,c.r,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  const bw=c.type==='boss'?46:c.r*2+8,bh=c.type==='boss'?5:3.5;
  const barY=c.y-58*k-8;
  const pct=Math.max(0,c.hp/c.maxhp);
  ctx.fillStyle='rgba(5,3,10,.85)';
  rr(ctx,c.x-bw/2-1,barY-1,bw+2,bh+2,2);ctx.fill();
  const hc=hpCols(pct);
  const barG=ctx.createLinearGradient(c.x-bw/2,0,c.x-bw/2+bw,0);
  barG.addColorStop(0,hc[0]);barG.addColorStop(1,hc[1]);
  ctx.fillStyle=barG;ctx.fillRect(c.x-bw/2,barY,bw*pct,bh);
  /* ▲ GLM PHASE 7 — shape cue for critical HP in color-vision mode. */
  if(PREFS.cb&&pct<=.25&&pct>0){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;
    ctx.strokeRect(c.x-bw/2-.5,barY-.5,bw*pct+1,bh+1);
  }
  if(bw>=30){
    ctx.fillStyle='rgba(0,0,0,.35)';
    for(let i=1;i<4;i++)ctx.fillRect(c.x-bw/2+bw*i/4,barY,1,bh);
  }
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  ctx.strokeRect(c.x-bw/2-.5,barY-.5,bw+1,bh+1);
}
function ringAt(x,y,r,color,alpha,rot){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=1.5;
  ctx.setLineDash([10,8]);if(rot!==undefined)ctx.lineDashOffset=rot;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.restore();
}
function render(){
  ctx.save();
  const shMul=(ART.motion?.25:0)*(PREFS.shake?Q().shake:0);
  if(shake>0)ctx.translate((Math.random()-.5)*shake*shMul,(Math.random()-.5)*shake*shMul);
  ctx.drawImage(bgCv,0,0,W,H);
  drawSky();
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.save();
  ctx.beginPath();ctx.moveTo(WAY[0].x,WAY[0].y);
  for(let i=1;i<WAY.length;i++)ctx.lineTo(WAY[i].x,WAY[i].y);
  ctx.globalCompositeOperation='lighter';
  ctx.lineDashOffset=-time*26;
  ctx.setLineDash([16,26]);
  ctx.strokeStyle=hexA(TPAL.dash,.16);ctx.lineWidth=6;ctx.stroke();
  ctx.lineDashOffset=-time*26-11;
  ctx.setLineDash([5,37]);
  ctx.strokeStyle=hexA(TPAL.dash,.55);ctx.lineWidth=2;ctx.stroke();
  ctx.setLineDash([]);
  // traveling rune pulses — energy flowing to the keep
  if(Q().runes)
  for(let k=0;k<3;k++){
    const d=((time*55+k*PATHLEN/3)%PATHLEN);
    const p=posAt(d);
    const a=Math.sin(Math.PI*Math.min(1,d/PATHLEN))*.55;
    const g2=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,15);
    g2.addColorStop(0,hexA(TPAL.dash,.6*a));g2.addColorStop(1,hexA(TPAL.dash,0));
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,15,0,TAU);ctx.fill();
    ctx.fillStyle=hexA('#ffffff',.85*a);
    ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fill();
  }
  ctx.restore();
  drawMist();
  // ── BREACH PORTAL ──
  ctx.save();ctx.translate(BREACH.x,BREACH.y);
  ctx.globalCompositeOperation='lighter';
  const pg=ctx.createRadialGradient(0,0,2,0,0,26);
  pg.addColorStop(0,hexA(TPAL.breach,.55));
  pg.addColorStop(.6,hexA(TPAL.breach,.18));
  pg.addColorStop(1,hexA(TPAL.breach,0));
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.fill();
  for(let i=0;i<3;i++){
    ctx.save();ctx.rotate(time*(.6+i*.35)*(i%2?-1:1));
    ctx.strokeStyle=hexA(i===1?'#ffb8ec':TPAL.breach,.7-.2*i);
    ctx.lineWidth=1.6;
    ctx.setLineDash([7+i*4,9+i*3]);
    ctx.beginPath();ctx.arc(0,0,12+i*4.5,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  for(let i=0;i<6;i++){
    const a=time*1.7+i*TAU/6;
    const rr3=13+3*Math.sin(time*2.4+i);
    ctx.fillStyle=hexA('#ffd0da',.8);
    ctx.beginPath();ctx.arc(Math.cos(a)*rr3,Math.sin(a)*rr3*.9,1.5,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  const mg=ctx.createRadialGradient(0,0,1,0,0,10);
  mg.addColorStop(0,'#000');mg.addColorStop(1,'#0a0410');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.fill();
  if(waveActive){
    const pr=(time*.9)%1;
    ctx.globalAlpha=(1-pr)*.45;
    ctx.strokeStyle=TPAL.breach;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,12+pr*20,0,TAU);ctx.stroke();
  }
  ctx.restore();
  // ── THE KEEP ──
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.ellipse(GATE.x+2,GATE.y+14,26,9,0,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  const kg=ctx.createRadialGradient(GATE.x,GATE.y,4,GATE.x,GATE.y,44);
  kg.addColorStop(0,hexA(TPAL.acc,.20));kg.addColorStop(1,hexA(TPAL.acc,0));
  ctx.fillStyle=kg;ctx.beginPath();ctx.arc(GATE.x,GATE.y,44,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=TPAL.plate;rr(ctx,GATE.x-18,GATE.y-18,36,36,4);ctx.fill();
  ctx.strokeStyle=gateFlash>0?TPAL.breach:TPAL.acc;ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;
  rr(ctx,GATE.x-16,GATE.y-16,32,32,3);ctx.stroke();
  ctx.fillStyle=TPAL.plateLine;
  for(let i=0;i<4;i++)ctx.fillRect(GATE.x-16+i*9,GATE.y-23,6,6);
  ctx.fillStyle='#05030a';
  rr(ctx,GATE.x-4,GATE.y-6,8,20,3);ctx.fill();
  const fl=Math.sin(time*3)*2.2,fl2=Math.sin(time*3+.9)*1.6;
  ctx.strokeStyle=TPAL.plateLine;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(GATE.x-8,GATE.y-22);ctx.lineTo(GATE.x-8,GATE.y-38);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GATE.x+8,GATE.y-22);ctx.lineTo(GATE.x+8,GATE.y-38);ctx.stroke();
  ctx.fillStyle=TPAL.acc;
  ctx.beginPath();
  ctx.moveTo(GATE.x-8,GATE.y-38);
  ctx.quadraticCurveTo(GATE.x,GATE.y-41+fl,GATE.x+8,GATE.y-38);
  ctx.lineTo(GATE.x+8,GATE.y-26+fl2);
  ctx.quadraticCurveTo(GATE.x,GATE.y-29+fl2,GATE.x-8,GATE.y-26+fl2);
  ctx.closePath();ctx.fill();
  ctx.globalCompositeOperation='lighter';
  const lp=.5+.5*Math.sin(time*2.2);
  ctx.fillStyle=hexA('#ffdf9a',.5+.4*lp);
  ctx.beginPath();ctx.arc(GATE.x-13,GATE.y+8,1.8,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(GATE.x+13,GATE.y+8,1.8,0,TAU);ctx.fill();
  ctx.fillStyle=hexA('#ffdf9a',.12*lp);
  ctx.beginPath();ctx.arc(GATE.x-13,GATE.y+8,6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(GATE.x+13,GATE.y+8,6,0,TAU);ctx.fill();
  ctx.restore();
  if(waveActive&&curMod){
    ctx.textAlign='left';ctx.font='600 11px Consolas,monospace';
    ctx.fillStyle=hexA('#f2b45c',.9);
    ctx.fillText('◤ '+WMODS[curMod].label+' — '+WMODS[curMod].desc,14,24);
  }
  if(placing&&mouse.on){
    ctx.fillStyle=hexA(TPAL.iv,.08);
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)
      if(canPlace(c,r))ctx.fillRect((c+.5)*CELL-1,(r+.5)*CELL-1,2,2);
    const c=Math.floor(mouse.x/CELL),r=Math.floor(mouse.y/CELL);
    if(c>=0&&c<COLS&&r>=0&&r<ROWS){
      const ok=canPlace(c,r)&&gold>=towerCost(placing);
      ctx.fillStyle=ok?'rgba(143,208,138,.18)':'rgba(255,92,122,.2)';
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
      ctx.strokeStyle=ok?'rgba(143,208,138,.6)':'rgba(255,92,122,.6)';
      ctx.lineWidth=1;ctx.strokeRect(c*CELL+.5,r*CELL+.5,CELL-1,CELL-1);
      /* ▲ GLM PHASE 7 — invalid placement also carries an X shape cue. */
      if(!ok){
        const cx=c*CELL+CELL/2,cy=r*CELL+CELL/2;
        ctx.strokeStyle='rgba(255,235,240,.85)';ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(cx-11,cy-11);ctx.lineTo(cx+11,cy+11);
        ctx.moveTo(cx+11,cy-11);ctx.lineTo(cx-11,cy+11);
        ctx.stroke();
      }
    }
  }
  if(sel) ringAt(sel.x,sel.y,statRange(sel),TPAL.acc,.55+.12*Math.sin(time*3),-time*20);
  else if(hoverTower&&!placing) ringAt(hoverTower.x,hoverTower.y,statRange(hoverTower),TPAL.iv,.2);
  for(const t of towers)drawTowerBody(t,false);
  for(const c of creeps)drawCreep(c);
  for(const p of projs){
    if(p.kind!=='sabot')continue;
    const t=Math.min(1,p.t/p.ft);
    const x=p.x+(p.tx-p.x)*t,y=p.y+(p.ty-p.y)*t;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#ff9a5c';ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.fill();
    ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(x,y,8,0,TAU);ctx.fill();
    ctx.restore();
  }
  for(const s of shells){
    const p=Math.min(1,s.t/s.ft);
    const x=s.sx+(s.tx-s.sx)*p,y0=s.sy+(s.ty-s.sy)*p,y=y0-Math.sin(p*Math.PI)*34;
    ctx.globalAlpha=.26;ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x,y0,3,0,TAU);ctx.fill();ctx.globalAlpha=1;
    shellP(ctx,x,y,Math.atan2(s.ty-s.sy,s.tx-s.sx),13);
  }
  for(const f of frostFx){
    const a=1-f.t/f.dur;
    ctx.save();ctx.globalAlpha=a;
    frostRing(ctx,f.x,f.y,f.s*(0.6+0.6*(f.t/f.dur)));
    ctx.restore();
  }
  for(const p of projs){
    if(p.kind==='shard')shardP(ctx,p.x,p.y,p.ang,8);
    else if(p.kind==='sabot')continue;
    else boltP(ctx,p.x,p.y,p.ang,24,'#f2b45c','#fff2cf');
  }
  for(const z of zaps){
    const a=z.life/z.max;
    ctx.save();ctx.globalAlpha=a;
    zapPath(ctx,jagged(z.pts[0][0],z.pts[0][1],
      z.pts[z.pts.length-1][0],z.pts[z.pts.length-1][1],Math.floor(time*90)));
    ctx.restore();
  }
  for(const b of beams){
    const a=b.life/b.max;
    railBeam(ctx,b.x1,b.y1,b.x2,b.y2,a);
  }
  for(const b of booms){
    const p=b.t/b.dur;
    if(p<0)continue; // delayed layered boss booms
    ctx.save();ctx.globalAlpha=Math.max(0,1-p);
    boom(ctx,b.x,b.y,b.s*(0.7+0.6*p));
    ctx.restore();
  }
  for(const f of empFx){
    const p=f.t/f.dur;
    ctx.save();ctx.globalAlpha=1-p;
    ctx.strokeStyle='#d16bff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(f.x,f.y,f.s*p+10,0,TAU);ctx.stroke();
    ctx.strokeStyle=hexA('#d16bff',.4);ctx.lineWidth=8;
    ctx.beginPath();ctx.arc(f.x,f.y,f.s*p*.7+6,0,TAU);ctx.stroke();
    ctx.restore();
  }
  for(const p of parts){
    if(p.flame){ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);
      flame(ctx,p.x,p.y,p.rot,p.s*(p.life/p.max));ctx.restore();continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=Math.max(0,p.life/p.max)*.9;ctx.fillStyle=p.color;
    if(p.petal)diamondPath(ctx,p.s);else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
    ctx.fill();ctx.restore();
  }
  for(const r of rings){
    ctx.save();ctx.globalAlpha=Math.max(0,r.life/r.max);

    ctx.fillStyle='#f0d8ff';

    ctx.fillStyle='#c9a8e8';

    ctx.restore();

  if(bossDieFx){

    ctx.save();ctx.globalAlpha=(1-p)*.35;

/* ---------- input (▲ GLM PHASE 5 — unified Pointer Events) ---------- */
function toLocal(e){
  const rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};
}
/* Mobile overview and zoom keep the logical game grid unchanged. */
const boardWrap=$('boardWrap');
let zoomScale=1,lastMapLandscape=null;
const mobileMap=()=>innerWidth<=700||(innerWidth<=950&&innerWidth>innerHeight);
function updateMapZoom(keepCenter=true,focus=null,anchor=null){
  if(!mobileMap()){
    document.body.classList.remove('map-overview');
    cv.style.removeProperty('width');cv.style.removeProperty('height');
    return;
  }
  const oldRect=cv.getBoundingClientRect(),wrapRect=boardWrap.getBoundingClientRect();
  const fx=focus?.x??wrapRect.left+boardWrap.clientWidth/2;
  const fy=focus?.y??wrapRect.top+boardWrap.clientHeight/2;
  const x=anchor?.x??(fx-oldRect.left)/Math.max(1,oldRect.width);
  const y=anchor?.y??(fy-oldRect.top)/Math.max(1,oldRect.height);
  const fit=Math.max(1,Math.min(boardWrap.clientWidth,boardWrap.clientHeight*W/H));
  const width=fit*zoomScale;
  document.body.classList.toggle('map-overview',zoomScale<=1.001);
  cv.style.width=width+'px';cv.style.height=width*H/W+'px';
  $('zoomLabel').textContent=Math.round(zoomScale*100)+'%';
  if(keepCenter){
    const newRect=cv.getBoundingClientRect();
    boardWrap.scrollLeft+=newRect.left+x*width-fx;
    boardWrap.scrollTop+=newRect.top+y*width*H/W-fy;
  }else{boardWrap.scrollLeft=0;boardWrap.scrollTop=0;}
}
function resetMapZoomForOrientation(){
  const landscape=innerWidth>innerHeight;
  if(landscape!==lastMapLandscape){lastMapLandscape=landscape;zoomScale=landscape?1:2.5;updateMapZoom(false);}
  else updateMapZoom();
}
$('zoomFit').onclick=()=>{zoomScale=1;updateMapZoom(false);};
window.addEventListener('resize',()=>requestAnimationFrame(resetMapZoomForOrientation));
requestAnimationFrame(resetMapZoomForOrientation);
cv.addEventListener('pointermove',e=>{
  const p=toLocal(e);mouse.x=p.x;mouse.y=p.y;mouse.on=true;
  const c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  hoverTower=(!placing&&c>=0&&c<COLS&&r>=0&&r<ROWS)?towerAt.get(c+','+r)||null:null;
},{passive:true});
cv.addEventListener('pointerleave',()=>{mouse.on=false;hoverTower=null;});
const mapTouches=new Map();
let mapPinch=null,mapGesture=false;
function beginMapPinch(){
  const [a,b]=[...mapTouches.values()];
  const rect=cv.getBoundingClientRect(),midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
  mapPinch={distance:Math.hypot(a.x-b.x,a.y-b.y)||1,scale:zoomScale,
    anchor:{x:(midX-rect.left)/rect.width,y:(midY-rect.top)/rect.height}};
  mapGesture=true;
}
cv.addEventListener('pointercancel',e=>{
  mouse.on=false;mapTouches.delete(e.pointerId);
  if(mapTouches.size<2)mapPinch=null;
  if(!mapTouches.size)mapGesture=false;
});
function boardPress(e){
  lastTouch=e.pointerType==='touch';
  const cp=$('cancelPlace');if(cp)cp.hidden=!(placing&&lastTouch);
  if(state!=='play'||e.button!==0)return;
  const p=toLocal(e),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  if(placing){
    const cost=towerCost(placing);
    if(canPlace(c,r)&&gold>=cost){
      const t={key:placing,c,r,x:(c+.5)*CELL,y:(r+.5)*CELL,ang:-Math.PI/2,
        cool:0,dmgLv:0,rateLv:0,invested:cost,mode:'first',flash:0,recoil:0,spin:0,kills:0,
        abCd:0,odT:0,disabledT:0};
      towers.push(t);towerAt.set(c+','+r,t);
      gold-=cost;sfx('place');
      rings.push({x:(c+.5)*CELL,y:(r+.5)*CELL,r:4,vr:120,life:.3,max:.3,color:TOWERS[placing].color});
      if(!e.shiftKey)setPlacing(null);
      saveGame(true);
    }else{
      sfx('deny');
      floaters.push({x:p.x,y:p.y,txt:gold<cost?'NO GOLD':'BLOCKED',life:.8,color:TPAL.breach});
    }
  }else{
    sel=towerAt.get(c+','+r)||null;renderInspector();
  }
}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    cv.setPointerCapture(e.pointerId);
    mapTouches.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,
      scrollX:boardWrap.scrollLeft,scrollY:boardWrap.scrollTop,moved:false});
    if(mapTouches.size===2)beginMapPinch();
    return;
  }
  boardPress(e);
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!mapTouches.has(e.pointerId))return;
  const touch=mapTouches.get(e.pointerId);
  touch.x=e.clientX;touch.y=e.clientY;
  if(mapTouches.size>=2){
    if(!mapPinch)beginMapPinch();
    const [a,b]=[...mapTouches.values()];
    const distance=Math.hypot(a.x-b.x,a.y-b.y);
    zoomScale=Math.max(1,Math.min(3,mapPinch.scale*distance/mapPinch.distance));
    updateMapZoom(true,{x:(a.x+b.x)/2,y:(a.y+b.y)/2},mapPinch.anchor);
  }else if(mapTouches.size===1){
    if(Math.hypot(touch.x-touch.startX,touch.y-touch.startY)>10)touch.moved=true;
    if(touch.moved){
      boardWrap.scrollLeft=touch.scrollX-(touch.x-touch.startX);
      boardWrap.scrollTop=touch.scrollY-(touch.y-touch.startY);
    }
  }
});
cv.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||!mapTouches.has(e.pointerId))return;
  const touch=mapTouches.get(e.pointerId);
  const tap=!mapGesture&&!touch.moved&&Math.hypot(e.clientX-touch.startX,e.clientY-touch.startY)<=10;
  mapTouches.delete(e.pointerId);
  if(mapTouches.size<2)mapPinch=null;
  if(mapTouches.size===1){
    const remaining=[...mapTouches.values()][0];
    remaining.startX=remaining.x;remaining.startY=remaining.y;
    remaining.scrollX=boardWrap.scrollLeft;remaining.scrollY=boardWrap.scrollTop;
  }else if(!mapTouches.size)mapGesture=false;
  if(tap)boardPress(e);
});

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return;}
  try{
    const rawDt=now-last;last=now;
    const dt=Math.min(.05,rawDt/1000);time+=dt;
    qualSample(Math.min(100,Math.max(0,rawDt)));
    /* ▲ GLM PHASE 35 — numeric safety nets (never clamp legit large values). */
    if(!isFinite(gold))gold=0;
    if(!isFinite(lives)||lives<-1e9)lives=0;
    /* ▲ GLM PHASE 4/8 — ambient cosmetics honor quality + reduced motion. */
    const mo=ART.motion?1:0;
    if(Q().petal>0)for(const p of petals){
      p.x+=p.vx*dt*mo+Math.sin(time*1.2+p.ph)*8*dt*mo;
      p.y+=p.vy*dt*mo;p.rot+=p.vr*dt*mo;
      if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
      if(p.x<-6)p.x=W+6;if(p.x>W+6)p.x=-6;
    }
    if(Q().fog>0)for(const f of fogBlobs){
      f.x+=f.vx*dt*mo;
      if(f.x-f.w/2>W)f.x=-f.w/2;
    }
    if(shoot){shoot.life-=dt;if(shoot.life<=0)shoot=null;}
    else{shootT-=dt;
      if(shootT<=0){shootT=6+Math.random()*9;
        shoot={x:W*(.15+Math.random()*.7),y:H*(.05+Math.random()*.3),
          vx:(Math.random()<.5?-1:1)*(260+Math.random()*160),
          vy:120+Math.random()*90,life:.7,max:.7};}}
    if(state==='play'&&!paused)update(dt*speedMul);
    shake=Math.max(0,shake-14*dt);
    gateFlash=Math.max(0,gateFlash-dt);
    bossVignette=Math.max(0,bossVignette-dt*.55);
    if(bossDieFx){bossDieFx.t+=dt;if(bossDieFx.t>bossDieFx.dur)bossDieFx=null;}
    render();hudFrame();
    if(dbgEl){dbgT-=dt;
      if(dbgT<=0){dbgT=.25;
        dbgEl.textContent='FPS '+Math.round(1000/Math.max(1,QUAL.avg))+' · frame '+QUAL.avg.toFixed(1)+'ms'
        +'\ncreeps '+creeps.length+' · towers '+towers.length+' · proj '+(projs.length+shells.length)
        +'\nparts '+parts.length+' · float '+floaters.length+' · rings '+rings.length

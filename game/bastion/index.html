<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BASTION — Four Frontiers</title>

</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/><path d="M3 21h18"/></svg>
      <div><h1>BASTION</h1><span class="sub">ORCHID PROTOCOL · DIRECTIVE 11</span></div>
    </div>
    <div class="hspacer"></div>
    <div class="stats">
      <div class="stat"><span id="icoLives"></span><b id="livesV">15</b><span class="lbl">LIVES</span></div>
      <div class="stat"><span id="icoGold"></span><b id="goldV" class="num">180</b><span class="lbl">GOLD</span></div>
      <div class="stat"><b id="waveV">0/30</b><span class="lbl">WAVE</span></div>
      <div class="stat"><b id="comboV" class="num"></b><span class="lbl">COMBO</span></div>
    </div>
    <div class="controls">
      <button class="cbtn" id="menuBtn" title="Main menu" aria-label="Open main menu">⌂</button>
      <button class="cbtn" id="themeBtn" title="Theme (T)"></button>
      <button class="cbtn" id="settingsBtn" title="Settings" aria-label="Open settings"></button>
      <button class="cbtn" id="pauseBtn" title="Pause (P)"></button>
      <button class="cbtn" id="speedBtn" title="Game speed">1×</button>
      <button class="cbtn" id="soundBtn" title="Sound"></button>
    </div>
  </header>
  <main>
    <div id="boardTools"><span class="map-tip">DRAG MAP · PINCH TO ZOOM · TAP TOWER</span><div class="zoom-buttons"><button id="zoomFit" aria-label="Fit whole map">FIT</button><span id="zoomLabel">100%</span></div></div>
    <div id="boardWrap">
      <canvas id="cv" width="1536" height="864"></canvas>
      <div id="banner"><b id="bnMain"></b><span id="bnSub"></span></div>
      <div id="edgeFlash"></div>
      <button id="cancelPlace" class="cancelchip" hidden>✕ CANCEL PLACEMENT</button>
    </div>
    <aside id="rail">
      <section><h3>ARMORY</h3><div id="shop"></div></section>
      <section><h3>INSPECTOR</h3><div id="inspector"></div></section>
      <section><h3>WAVE CONTROL</h3>
        <div id="wavePre"></div>
        <button class="launch" id="launchBtn"><span id="launchTxt">LAUNCH WAVE 1</span><span id="launchSub"></span></button>
        <div id="autoBar"><i id="autoFill"></i></div>
      </section>
    </aside>
  </main>
  <div id="shopInfo" role="tooltip" hidden></div>
  <div id="overlay"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
